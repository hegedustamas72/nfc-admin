<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz Őrző</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Arial;
  background:url("magic8.jpeg") center/cover no-repeat;
  color:white;
}

/* ===== TOP CATEGORY ===== */
.top{
  position:absolute;
  top:5%;
  width:100%;
  text-align:center;
  opacity:0;
  transform:translateY(-10px);
  transition:0.35s ease;
}

.top.show{
  opacity:1;
  transform:translateY(0);
}

.category{
  font-size:42px;
  font-weight:bold;
}

/* ===== CENTER CARD ===== */
.card{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:100px;
  height:50px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:18px;
  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(6px);

  transition:0.35s ease;
}

.card.hide{
  opacity:0;
  transform:translate(-50%,-50%) scale(0.85);
}

#spinner{
  font-size:34px;
  font-weight:bold;
}

/* ===== BOTTOM ===== */
.bottom{
  position:absolute;
  bottom:5%;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

#answer{
  font-size:34px;
  margin-bottom:10px;
}

#hint{
  font-size:14px;
  opacity:0.85;
  margin-bottom:14px;
}

/* BUTTON (viking style) */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;
  border-radius:14px;

  background:#9B6A6C;
  color:white;
  text-decoration:none;

  font-family:'Alex Brush',cursive;
  font-weight:600;

  box-shadow:0 4px 10px rgba(0,0,0,0.12);
}

.btn img{
  width:20px;
  height:20px;
}
</style>
</head>

<body>

<!-- TOP CATEGORY -->
<div class="top">
  <div class="category"></div>
</div>

<!-- CENTER CARD -->
<div class="card">
  <div id="spinner">-</div>
</div>

<!-- BOTTOM -->
<div class="bottom">
  <div id="answer">-</div>
  <div id="hint">Újabb válaszért érintsd újra a bilétát!</div>

  <a class="btn" href="valaszorzo.html">
    <img src="brand-icon.png">
    Kattkaland
  </a>
</div>

<script>
(() => {

  const params = new URLSearchParams(window.location.search);
  let item = null;

  try {
    item = JSON.parse(decodeURIComponent(params.get("data")));
  } catch(e){}

  if (!item) item = { answer:"Nincs adat", type:"no" };

  const spinner = document.getElementById("spinner");
  const card = document.querySelector(".card");
  const top = document.querySelector(".top");
  const categoryEl = document.querySelector(".category");
  const answerEl = document.getElementById("answer");

  const spin = ["Igen","Nem","Talán"];
  let i = 0;

  // spin
  const interval = setInterval(()=>{
    spinner.textContent = spin[i++ % 3];
  }, 110);

  // stop + reveal (GYORSABB VÁLTÁS)
  setTimeout(()=>{

    clearInterval(interval);

    const map = {
      yes:"Igen",
      no:"Nem",
      maybe:"Talán",
      clue:"Rejtély"
    };

    const cat = map[item.type] || "Ismeretlen";

    // CARD collapse (érzékelhető!)
    card.classList.add("hide");

    setTimeout(()=>{

      // top category appear
      categoryEl.textContent = cat;
      top.classList.add("show");

      // bottom content
      answerEl.textContent = item.answer ?? "-";

    }, 250);

  }, 1400);

})();
</script>

</body>
</html>
