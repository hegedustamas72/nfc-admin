<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz Őrző</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Arial;
  background:url("magic8.jpeg") center/cover no-repeat;
  color:white;
}

/* =========================
   CENTER CARD
========================= */
.center-wrap{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.card{
  display:flex;
  align-items:center;
  justify-content:center;

  min-width:160px;
  min-height:90px;

  padding:14px 22px;

  border-radius:16px;

  background:rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);

  font-size:34px;
  font-weight:bold;
}

/* CATEGORY (after spin) */
.category-top{
  position:absolute;
  top:6%;
  width:100%;
  text-align:center;

  font-size:42px;
  font-weight:bold;
}

/* =========================
   BOTTOM BLOCK
========================= */
.bottom{
  position:absolute;
  bottom:5%;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

#answer{
  font-size:34px;
  margin-bottom:10px;
}

#hint{
  font-size:14px;
  opacity:0.85;
  margin-bottom:14px;
}

/* BUTTON (vikinges style marad) */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;
  border-radius:14px;

  background:#9B6A6C;
  color:white;
  text-decoration:none;

  font-family:'Alex Brush',cursive;
  font-weight:600;

  box-shadow:0 4px 10px rgba(0,0,0,0.12);
}

.btn img{
  width:20px;
  height:20px;
}
</style>
</head>

<body>

<!-- CENTER CARD -->
<div class="center-wrap">
  <div class="card" id="spinner">-</div>
</div>

<!-- TOP CATEGORY -->
<div class="category-top" id="category"></div>

<!-- BOTTOM -->
<div class="bottom">
  <div id="answer">-</div>

  <div id="hint">Újabb válaszért érintsd újra a bilétát!</div>

  <a class="btn" href="valaszorzo.html">
    <img src="brand-icon.png">
    Kattkaland
  </a>
</div>

<script>
(() => {

  const params = new URLSearchParams(window.location.search);
  let item = null;

  try {
    item = JSON.parse(decodeURIComponent(params.get("data")));
  } catch(e){}

  if (!item) {
    item = { answer:"Nincs adat", type:"no" };
  }

  const spinner = document.getElementById("spinner");
  const categoryEl = document.getElementById("category");
  const answerEl = document.getElementById("answer");

  const spin = ["Igen","Nem","Talán"];
  let i = 0;

  function mapType(t){
    switch(t){
      case "yes": return "Igen";
      case "no": return "Nem";
      case "maybe": return "Talán";
      case "clue": return "Rejtély";
      default: return "Ismeretlen";
    }
  }

  // SPIN (shorter + smoother feel)
  const interval = setInterval(()=>{
    spinner.textContent = spin[i++ % 3];
  }, 100);

  // FAST TRANSITION (reduced delay)
  setTimeout(()=>{
    clearInterval(interval);

    const cat = mapType(item.type);

    // spinner disappears
    spinner.style.opacity = "0";

    setTimeout(()=>{
      document.querySelector(".center-wrap").style.display = "none";

      categoryEl.textContent = cat;
      answerEl.textContent = item.answer;

    }, 250);

  }, 1400);

})();
</script>

</body>
</html>
