<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Válasz őrző</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("magic8.jpeg");

  background-size:cover;
  background-position:center;

  color:white;
  font-family:"DM Sans",sans-serif;
}

.card{
  text-align:center;
  width:min(420px,100%);
  padding:20px;
}

.big{
  font-size:42px;
  font-weight:700;
  letter-spacing:2px;
}

.answer{
  margin-top:20px;
  font-size:26px;
  font-weight:600;
}

.small{
  margin-top:10px;
  opacity:.7;
  font-size:14px;
}

.btn{
  margin-top:30px;
  display:inline-block;
  padding:12px 18px;
  border-radius:14px;
  background:#9B6A6C;
  color:white;
  text-decoration:none;
  font-weight:600;
}

</style>

</head>

<body>

<div class="card">

  <div class="big" id="rolling">A sors dönt...</div>

  <div id="result" class="answer"></div>

  <div class="small" id="hint"></div>

  <a class="btn" href="index.html">Kattkaland</a>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// SUPABASE
const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

// SESSION ID
const params = new URLSearchParams(location.search)
const sessionId = params.get("id")

// UI
const rolling = document.getElementById("rolling")
const result = document.getElementById("result")
const hint = document.getElementById("hint")

// fallback
const fallback = {
  answer: "Nincs adat 😔",
  answer_type: "no"
}

// fetch adat
async function load(){

  if(!sessionId){
    show(fallback)
    return
  }

  const { data, error } = await supabase
    .from("valaszorzo_links")
    .select("*")
    .eq("session_id", sessionId)
    .maybeSingle()

  if(error){
    console.error(error)
    show(fallback)
    return
  }

  if(!data){
    show(fallback)
    return
  }

  show(data)
}

// animáció
function animate(finalText){

  const words = ["IGEN","NEM","TALÁN","REJTÉLY"]

  let i = 0

  const interval = setInterval(() => {

    rolling.textContent = words[i % words.length]
    i++

    if(i > 12){
      clearInterval(interval)
      rolling.textContent = "Kész"
      result.textContent = finalText.answer
      hint.textContent = "Új válaszhoz érintsd újra a bilétát"
    }

  }, 80)
}

// megjelenítés
function show(data){
  animate(data)
}

// start
load()

</script>

</body>
</html>
