<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz Őrző</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Arial;
  background:url("magic8.jpeg") center/cover no-repeat;
  color:white;
}

/* ===== TOP CATEGORY ===== */
.top{
  position:absolute;
  top:5%;
  width:100%;
  text-align:center;
  opacity:0;
  transform:translateY(-10px);
  transition:0.35s ease;
}

.top.show{
  opacity:1;
  transform:translateY(0);
}

.category{
  font-size:42px;
  font-weight:bold;
}

/* ===== CENTER CARD ===== */
.card{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  width:110px;
  height:110px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,0.08);

  backdrop-filter:blur(5px);

  box-shadow:
      0 0 20px rgba(255,255,255,.10);

  transition:all .35s ease;
}

.inner{
  width:85px;
  height:85px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);

  backdrop-filter:blur(4px);

  animation: float 3.5s ease-in-out infinite;
}

@keyframes float{
  0%   { transform:translateY(0px); }
  50%  { transform:translateY(-4px); }
  100% { transform:translateY(0px); }
}

@keyframes pulse{
  0%{
    transform:scale(0.7);
    opacity:0.4;
    box-shadow:0 0 8px rgba(255,255,255,0.2);
  }
  50%{
    transform:scale(1.1);
    opacity:0.9;
    box-shadow:0 0 18px rgba(255,255,255,0.35);
  }
  100%{
    transform:scale(0.7);
    opacity:0.4;
    box-shadow:0 0 8px rgba(255,255,255,0.2);
  }
}
  
.card.hide{
  opacity:0;
  transform:translate(-50%,-50%) scale(0.85);
}

  @keyframes pulseText{

  0%{
    transform:scale(.95);
    opacity:.65;
  }

  50%{
    transform:scale(1.08);
    opacity:1;
  }

  100%{
    transform:scale(.95);
    opacity:.65;
  }

}
#spinner{
  font-size:36px;
  font-weight:bold;

  color:white;

  text-shadow:
      0 0 8px rgba(255,255,255,.25),
      0 0 18px rgba(255,255,255,.18);

  animation:pulseText .9s ease-in-out infinite;
}

/* ===== BOTTOM ===== */
.bottom{
  position:absolute;
  bottom:3%;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

#answer{
  font-size:34px;
  margin-bottom:10px;
}

#hint{
  font-size:14px;
  opacity:0.85;
  margin-bottom:14px;
}

/* BUTTON (viking style) */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;
  border-radius:14px;

  background:#9B6A6C;
  color:white;
  text-decoration:none;

  font-family:'Alex Brush',cursive;
  font-weight:600;

  box-shadow:0 4px 10px rgba(0,0,0,0.12);
}

.btn img{
  width:20px;
  height:20px;
}
</style>
</head>

<body>

<!-- TOP CATEGORY -->
<div class="top">
  <div class="category"></div>
</div>

<!-- CENTER CARD -->
<div class="card">
  <div id="spinner"></div>
</div>

  
<!-- BOTTOM -->
<div class="bottom">
  <div id="answer">-</div>
  <div id="hint">Újabb válaszért érintsd újra a bilétát!</div>

  <a class="btn" href="valaszorzo.html">
    <img src="brand-icon.png">
    Kattkaland
  </a>
</div>

<script>
(() => {

  const params = new URLSearchParams(window.location.search);
  let item = null;

  try {
    item = JSON.parse(decodeURIComponent(params.get("data")));
  } catch(e){}

  if (!item) item = { answer:"Nincs adat", type:"no" };

  const spinner = document.getElementById("spinner");
  const card = document.querySelector(".card");
  const top = document.querySelector(".top");
  const categoryEl = document.querySelector(".category");
  const answerEl = document.getElementById("answer");

  const spin = ["Igen","Nem","Talán"];
  let i = 0;

  // spin
  const interval = setInterval(()=>{
    spinner.textContent = spin[i++ % 3];
  }, 110);

  // stop + reveal (GYORSABB VÁLTÁS)
  setTimeout(()=>{

    clearInterval(interval);

    const map = {
      yes:"Igen",
      no:"Nem",
      maybe:"Talán",
      clue:"Rejtély"
    };

    const cat = map[item.type] || "Ismeretlen";

    // CARD collapse (érzékelhető!)
    card.classList.add("hide");
    setTimeout(()=>{
    card.style.display="none";
},350);

    setTimeout(()=>{

      // top category appear
      categoryEl.textContent = cat;
      top.classList.add("show");

      // bottom content
      answerEl.textContent = item.answer ?? "-";

    }, 250);

  }, 1400);

})();
</script>

</body>
</html>
