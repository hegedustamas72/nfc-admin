<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz Őrző</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: url("magic8.jpeg") center/cover no-repeat;
}

/* ===== TOP ===== */
.top {
  position: absolute;
  top: 5%;
  width: 100%;
  text-align: center;
}

#spinner {
  font-size: 42px;
  font-weight: bold;
  height: 55px;
}

#category {
  font-size: 18px;
  opacity: 0.9;
  margin-top: 5px;
}

/* ===== BOTTOM CENTER FIX ===== */
.bottom {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;

  padding-bottom: 6%;
  text-align: center;
}

/* spacing blokk */
.spacer {
  height: 40%;
}

/* ===== CONTENT ===== */
#answer {
  font-size: 36px;
  min-height: 50px;
  margin-bottom: 18px;
}

#hint {
  font-size: 15px;
  opacity: 0.85;
  margin-bottom: 18px;
}

/* ===== VIKINGES GOMB ===== */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;

  border-radius:14px;

  background:#9B6A6C;

  color:white;

  text-decoration:none;
  font-family:'Alex Brush',cursive;
  font-weight:600;

  box-shadow:0 4px 10px rgba(0,0,0,0.12);

  transition: 0.2s;
}

.btn:hover{
  transform: scale(1.05);
}

.btn img{
  width:20px;
  height:20px;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="top">
  <div id="spinner">...</div>
  <div id="category"></div>
</div>

<!-- BOTTOM -->
<div class="bottom">

  <div class="spacer"></div>

  <div id="answer"></div>

  <div id="hint">
    Újabb válaszért érintsd újra a bilétát!
  </div>

  <a class="btn" href="valaszorzo.html">
    <img src="brand-icon.png" alt="">
    Kattkaland
  </a>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const raw = params.get("data");

let item = null;

try {
  if (raw) item = JSON.parse(decodeURIComponent(raw));
} catch (e) {
  console.error("JSON hiba:", e);
}

function isValidItem(i) {
  return i && i.answer && i.answer.trim() !== "" && i.type;
}

if (!isValidItem(item)) {
  item = {
    answer: "Nincs válasz",
    type: "no"
  };
}

const spinValues = ["Igen", "Nem", "Talán"];

const spinnerEl = document.getElementById("spinner");
const categoryEl = document.getElementById("category");
const answerEl = document.getElementById("answer");

/* 🔴 FIX: duplikáció ellen */
categoryEl.innerHTML = "";

let i = 0;
let interval;

function mapType(type) {
  switch(type) {
    case "yes": return "Igen";
    case "no": return "Nem";
    case "maybe": return "Talán";
    case "clue": return "Rejtély";
    default: return "Ismeretlen";
  }
}

function startSpin() {
  interval = setInterval(() => {
    spinnerEl.textContent = spinValues[i % spinValues.length];
    i++;
  }, 120);
}

function stopSpin() {
  clearInterval(interval);

  setTimeout(() => {
    const mapped = mapType(item.type);

    // spinner vége
    spinnerEl.textContent = (item.type === "clue") ? "Rejtély" : mapped;

    /* 🔴 FIX: kategória dupla render ellen */
    categoryEl.textContent = "";
    requestAnimationFrame(() => {
      categoryEl.textContent = mapped;
    });

    // válasz
    answerEl.textContent = item.answer;

  }, 500);
}

startSpin();
setTimeout(stopSpin, 2500);
</script>

</body>
</html>
