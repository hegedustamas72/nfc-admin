<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz Őrző</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Arial;
  background:url("magic8.jpeg") center/cover no-repeat;
  color:white;
}

/* TOP */
.top{
  position:absolute;
  top:5%;
  width:100%;
  text-align:center;
}

#spinner{
  font-size:38px;
  font-weight:bold;
}

/* ⚠️ CSAK EZ AZ EGY KATEGÓRIA MARAD */
.category{
  font-size:42px;
  font-weight:bold;
  margin-top:6px;
  min-height:50px;
}

/* BOTTOM */
.bottom{
  position:absolute;
  bottom:7%;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

#answer{
  font-size:36px;
  margin-bottom:10px;
}

#hint{
  font-size:14px;
  opacity:0.85;
  margin-bottom:14px;
}

/* BUTTON */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;
  border-radius:14px;

  background:#9B6A6C;
  color:white;
  text-decoration:none;

  font-family:'Alex Brush',cursive;
  font-weight:600;

  box-shadow:0 4px 10px rgba(0,0,0,0.12);
}

.btn img{
  width:20px;
  height:20px;
}
</style>
</head>

<body>

<div class="top">
  <div id="spinner">-</div>
  <div class="category"></div>
</div>

<div class="bottom">
  <div id="answer">-</div>
  <div id="hint">Újabb válaszért érintsd újra a bilétát!</div>

  <a class="btn" href="valaszorzo.html">
    <img src="brand-icon.png">
    Kattkaland
  </a>
</div>

<script>
(() => {

  const params = new URLSearchParams(window.location.search);
  let item;

  try {
    item = JSON.parse(decodeURIComponent(params.get("data")));
  } catch (e) {}

  if (!item) item = { answer: "Nincs adat", type: "no" };

  const spinner = document.getElementById("spinner");
  const categoryEl = document.querySelector(".category");
  const answerEl = document.getElementById("answer");

  function getCategory(type){
    if(type === "yes") return "Igen";
    if(type === "no") return "Nem";
    if(type === "maybe") return "Talán";
    if(type === "clue") return "Rejtély";
    return "Ismeretlen";
  }

  const spin = ["Igen", "Nem", "Talán"];
  let i = 0;

  const interval = setInterval(() => {
    spinner.textContent = spin[i++ % 3];
  }, 120);

  setTimeout(() => {
    clearInterval(interval);

    const cat = getCategory(item.type);

    // 🔥 FONTOS:
    // spinner = animáció vége
    spinner.textContent = cat;

    // ❌ NINCS DUPLIKÁCIÓ:
    // csak EZ az egy jelenik meg
    categoryEl.textContent = cat;

    answerEl.textContent = item.answer ?? "-";

  }, 2200);

})();
</script>

</body>
</html>
