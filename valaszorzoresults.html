<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Válasz őrző</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  min-height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("magic8.jpeg");

  background-size:cover;
  background-position:center;

  color:white;
  font-family:"DM Sans",sans-serif;
}

/* TOP */
.top{
  padding-top:30px;
  text-align:center;
}

.category{
  font-size:14px;
  opacity:.75;
  letter-spacing:2px;
  margin-bottom:10px;
}

.big{
  font-size:40px;
  font-weight:700;
  min-height:50px;
}

/* BOTTOM */
.bottom{
  text-align:center;
  padding-bottom:40px;
}

.answer{
  font-size:26px;
  font-weight:600;
  margin-bottom:10px;
}

.hint{
  font-size:13px;
  opacity:.7;
  margin-bottom:20px;
}

.btn{
  display:inline-block;
  padding:12px 18px;
  border-radius:14px;
  background:#9B6A6C;
  color:white;
  text-decoration:none;
  font-weight:600;
}

</style>

</head>

<body>

<div class="top">

  <div class="category">Válasz őrző</div>

  <div class="big" id="rolling">A sors dönt...</div>

</div>

<div class="bottom">

  <div class="answer" id="result"></div>

  <div class="hint" id="hint"></div>

  <a class="btn" href="index.html">Kattkaland</a>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const sessionId = new URLSearchParams(location.search).get("id")

const rolling = document.getElementById("rolling")
const result = document.getElementById("result")
const hint = document.getElementById("hint")

// 🔁 PÖRGÉS (csak ezek!)
const words = ["IGEN","NEM","TALÁN"]

// DB → UI mapping
const map = {
  yes: "IGEN",
  no: "NEM",
  maybe: "TALÁN",
  clue: "REJTÉLY"
}

async function load(){

  const { data } = await supabase
    .from("valaszorzo_links")
    .select("*")
    .eq("session_id", sessionId)
    .maybeSingle()

  if(!data){
    show({
      answer: "Nincs adat",
      answer_type: "no"
    })
    return
  }

  show(data)
}

function animate(data){

  let i = 0

  const interval = setInterval(() => {

    rolling.textContent = words[i % words.length]
    i++

    if(i > 14){
      clearInterval(interval)

      const final = map[data.answer_type] || "TALÁN"

      rolling.textContent = final
      result.textContent = data.answer
      hint.textContent = "Új válaszhoz érintsd újra a bilétát"
    }

  }, 80)
}

function show(data){
  animate(data)
}

load()

</script>

</body>
</html>
