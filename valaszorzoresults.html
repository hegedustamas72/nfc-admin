<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz Őrző</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: url("magic8.jpeg") center/cover no-repeat;
}

/* TOP */
.top {
  position: absolute;
  top: 5%;
  width: 100%;
  text-align: center;
}

#spinner {
  font-size: 42px;
  font-weight: bold;
  height: 55px;
}

#category_big {
  font-size: 42px;
  font-weight: bold;
  margin-top: 5px;
}

/* FORCE DUPLIKÁCIÓ ELLEN */
#category_big + #category_big {
  display: none !important;
}

#category {
  display: none !important;
}

/* BOTTOM */
.bottom {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;

  padding-bottom: 6%;
  text-align: center;
}

#answer {
  font-size: 36px;
  margin-bottom: 18px;
}

#hint {
  font-size: 15px;
  opacity: 0.85;
  margin-bottom: 18px;
}

/* BUTTON */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;

  border-radius:14px;

  background:#9B6A6C;
  color:white;

  text-decoration:none;
  font-family:'Alex Brush',cursive;
  font-weight:600;

  box-shadow:0 4px 10px rgba(0,0,0,0.12);
  transition: 0.2s;
}

.btn:hover{
  transform: scale(1.05);
}

.btn img{
  width:20px;
  height:20px;
}
</style>
</head>

<body>

<div class="top">
  <div id="spinner">...</div>
  <div id="category_big"></div>
</div>

<div class="bottom">

  <div id="answer"></div>

  <div id="hint">
    Újabb válaszért érintsd újra a bilétát!
  </div>

  <a class="btn" href="valaszorzo.html">
    <img src="brand-icon.png">
    Kattkaland
  </a>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const raw = params.get("data");

let item = null;

try {
  if (raw) item = JSON.parse(decodeURIComponent(raw));
} catch (e) {
  console.error(e);
}

if (!item || !item.answer) {
  item = { answer: "Nincs válasz", type: "no" };
}

/* 🔥 HARD FIX: CSAK 1 ELEM LEHET */
const categoryNodes = document.querySelectorAll("#category_big");
categoryNodes.forEach((el, idx) => {
  if (idx > 0) el.remove();
});

const spinnerEl = document.getElementById("spinner");
const categoryEl = document.getElementById("category_big");
const answerEl = document.getElementById("answer");

const spinValues = ["Igen", "Nem", "Talán"];
let i = 0;
let interval;

function mapType(t) {
  if (t === "yes") return "Igen";
  if (t === "no") return "Nem";
  if (t === "maybe") return "Talán";
  if (t === "clue") return "Rejtély";
  return "Ismeretlen";
}

function startSpin() {
  interval = setInterval(() => {
    spinnerEl.textContent = spinValues[i++ % 3];
  }, 120);
}

function stopSpin() {
  clearInterval(interval);

  setTimeout(() => {
    const mapped = mapType(item.type);

    spinnerEl.textContent = item.type === "clue" ? "Rejtély" : mapped;

    categoryEl.textContent = "";
    requestAnimationFrame(() => {
      categoryEl.textContent = mapped;
    });

    answerEl.textContent = item.answer;
  }, 500);
}

startSpin();
setTimeout(stopSpin, 2500);
</script>

</body>
</html>
