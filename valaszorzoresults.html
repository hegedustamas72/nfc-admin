<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz Őrző</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Arial;
  background:url("magic8.jpeg") center/cover no-repeat;
  color:white;
}

/* TOP */
.top{
  position:absolute;
  top:6%;
  width:100%;
  text-align:center;
}

#spinner{
  font-size:42px;
  font-weight:bold;
}

.category{
  font-size:42px;
  font-weight:bold;
  margin-top:6px;
}

/* BOTTOM */
.bottom{
  position:absolute;
  bottom:6%;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

#answer{
  font-size:34px;
  margin-bottom:10px;
}

#hint{
  font-size:14px;
  opacity:0.85;
  margin-bottom:14px;
}

/* BUTTON (vikinges style, de marad) */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;
  border-radius:14px;

  background:#9B6A6C;
  color:white;
  text-decoration:none;

  font-family:'Alex Brush',cursive;
  font-weight:600;

  box-shadow:0 4px 10px rgba(0,0,0,0.12);
}

.btn img{
  width:20px;
  height:20px;
}
</style>
</head>

<body>

<div class="top">
  <div id="spinner"></div>
  <div class="category"></div>
</div>

<div class="bottom">
  <div id="answer"></div>
  <div id="hint">Újabb válaszért érintsd újra a bilétát!</div>

  <a class="btn" href="valaszorzo.html">
    <img src="brand-icon.png">
    Kattkaland
  </a>
</div>

<script>
(() => {

  const params = new URLSearchParams(location.search);

  let item = null;
  try {
    item = JSON.parse(decodeURIComponent(params.get("data") || ""));
  } catch(e){}

  // fallback védelem
  if (!item || typeof item !== "object") {
    item = { answer: "Nincs válasz", type: "no" };
  }

  const spinner = document.getElementById("spinner");
  const categoryEl = document.querySelector(".category");
  const answerEl = document.getElementById("answer");

  const spin = ["Igen", "Nem", "Talán"];
  let i = 0;

  function mapType(t){
    switch((t || "").toLowerCase()){
      case "yes": return "Igen";
      case "no": return "Nem";
      case "maybe": return "Talán";
      case "clue": return "Rejtély";
      default: return null; // <-- NINCS Ismeretlen a UI-ban
    }
  }

  const interval = setInterval(() => {
    spinner.textContent = spin[i++ % 3];
  }, 120);

  setTimeout(() => {
    clearInterval(interval);

    const category = mapType(item.type);

    // spinner fix
    spinner.textContent = category || "—";

    // CSAK 1 kategória jelenik meg
    categoryEl.textContent = category || "";

    answerEl.textContent = item.answer || "";

    console.log("ITEM:", item);

  }, 2500);

})();
</script>

</body>
</html>
