)

const id = new URLSearchParams(location.search).get("id")

const { data, error } = await supabase
  .from("valaszorzo_links")
  .select("*")
  .eq("session_id", id)
  .maybeSingle()

if (error || !data) {
  document.body.innerHTML = "Nincs adat"
  throw error
}

const words = ["IGEN","NEM","TALÁN"]

function animate(data){
  let i = 0

  const interval = setInterval(() => {
    rolling.textContent = words[i % words.length]
    i++

    if (i > 14) {
      clearInterval(interval)

      rolling.textContent =
        data.answer_type === "yes" ? "IGEN"
        : data.answer_type === "no" ? "NEM"
        : data.answer_type === "clue" ? "REJTÉLY"
        : "TALÁN"

      result.textContent = data.answer
      hint.textContent = "Új érintés = új válasz"
    }
  }, 80)
}

animate(data)
</script>
