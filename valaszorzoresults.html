<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz Őrző</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Arial;
  background:url("magic8.jpeg") center/cover no-repeat;
  color:white;
}

/* ===== TOP CATEGORY ===== */

.top{
  position:absolute;
  top:5%;
  left:0;
  width:100%;

  text-align:center;

  opacity:0;
  transform:translateY(-10px);

  transition:
    opacity .35s ease,
    transform .35s ease;
}

.top.show{
  opacity:1;
  transform:translateY(0);
}

#category{
  font-size:42px;
  font-weight:bold;
}


/* ===== CENTER CARD ===== */

.card{
  position:absolute;
  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%)
    scale(1);

  width:110px;
  height:110px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(255,255,255,0.08);

  backdrop-filter:
    blur(5px);

  box-shadow:
    0 0 20px
    rgba(255,255,255,.10);

  transition:
    opacity .35s ease,
    transform .35s ease;

  opacity:1;
}

.card.hide{
  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(.55);
}


/* ===== SPINNER ===== */

#spinner{
  font-size:36px;
  font-weight:bold;

  white-space:nowrap;

  color:white;

  text-shadow:
    0 0 8px
    rgba(255,255,255,.25),

    0 0 18px
    rgba(255,255,255,.18);

  animation:
    pulseText .9s
    ease-in-out
    infinite;
}

@keyframes pulseText{

  0%{
    transform:scale(.95);
    opacity:.65;
  }

  50%{
    transform:scale(1.08);
    opacity:1;
  }

  100%{
    transform:scale(.95);
    opacity:.65;
  }

}


/* ===== BOTTOM ===== */

.bottom{
  position:absolute;
  bottom:3%;
  left:0;
  width:100%;

  padding:0 20px;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  opacity:0;

  transform:
    translateY(8px);

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.bottom.show{
  opacity:1;
  transform:translateY(0);
}

#answer{
  width:min(520px,100%);

  font-size:34px;
  font-weight:bold;
  line-height:1.25;

  margin-bottom:10px;
}

#hint{
  font-size:14px;
  opacity:0.85;

  margin-bottom:14px;
}


/* ===== KATTKALAND GOMB ===== */

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;

  border-radius:14px;

  background:#9B6A6C;
  color:white;

  text-decoration:none;

  font-family:'Alex Brush',cursive;
  font-size:22px;
  font-weight:600;

  box-shadow:
    0 4px 10px
    rgba(0,0,0,0.12);
}

.btn img{
  width:20px;
  height:20px;
}

</style>
</head>

<body>

<!-- TOP CATEGORY -->

<div class="top" id="top">
  <div id="category"></div>
</div>


<!-- CENTER CARD -->

<div class="card" id="card">
  <div id="spinner">
    Igen
  </div>
</div>


<!-- BOTTOM -->

<div class="bottom" id="bottom">

  <div id="answer"></div>

  <div id="hint">
    Újabb válaszért érintsd újra a bilétát!
  </div>

  <a
    class="btn"
    href="index.html"
  >
    <img
      src="brand-icon.png"
      alt=""
    >
    Kattkaland
  </a>

</div>


<script>
(() => {

  /* ---------------------------
     ADAT KIOLVASÁSA
  ----------------------------*/

  const params =
    new URLSearchParams(
      window.location.search
    );

  const raw =
    params.get("data");

  if (!raw) {
    console.error(
      "Hiányzó data paraméter."
    );
    return;
  }

  let item = null;

  try {

    /*
      FONTOS:
      URLSearchParams.get()
      már dekódolja az URL paramétert.
    */

    item =
      JSON.parse(raw);

  } catch (e) {

    console.error(
      "JSON hiba:",
      e
    );

    return;
  }


  /* ---------------------------
     ADATTISZTÍTÁS
  ----------------------------*/

  const answer =
    String(
      item.answer || ""
    ).trim();

  const type =
    String(
      item.type || ""
    )
    .trim()
    .toLowerCase();


  const map = {
    yes:"Igen",
    no:"Nem",
    maybe:"Talán",
    clue:"Rejtély"
  };

  const category =
    map[type];


  if (!answer || !category) {

    console.error(
      "Hibás válaszadat:",
      item
    );

    return;
  }


  /* ---------------------------
     UI
  ----------------------------*/

  const spinner =
    document.getElementById("spinner");

  const card =
    document.getElementById("card");

  const top =
    document.getElementById("top");

  const categoryEl =
    document.getElementById("category");

  const bottom =
    document.getElementById("bottom");

  const answerEl =
    document.getElementById("answer");


  /* ---------------------------
     FORGÁS
  ----------------------------*/

  const spin = [
    "Igen",
    "Nem",
    "Talán"
  ];

  let i = 0;

  const interval =
    setInterval(() => {

      spinner.textContent =
        spin[
          i % spin.length
        ];

      i++;

    }, 110);


  /* ---------------------------
     STOP + REVEAL
  ----------------------------*/

  setTimeout(() => {

    clearInterval(
      interval
    );

    card.classList.add(
      "hide"
    );


    /*
      Rövid összecsukódás,
      utána szinte azonnal
      jön az eredmény.
    */

    setTimeout(() => {

      card.style.display =
        "none";


      /* kategória */

      categoryEl.textContent =
        category;

      top.classList.add(
        "show"
      );


      /* válasz */

      answerEl.textContent =
        answer;

      bottom.classList.add(
        "show"
      );

    }, 180);

  }, 1400);

})();
</script>

</body>
</html>
