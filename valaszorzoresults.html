<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz Őrző</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: url("magic8.jpeg") center/cover no-repeat;
}

/* sötét overlay */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}

.container {
  position: relative;
  z-index: 2;
  top: 40%;
  transform: translateY(-50%);
}

/* forgó szöveg */
#spinner {
  font-size: 48px;
  font-weight: bold;
  letter-spacing: 2px;
  height: 60px;
}

/* végső válasz */
#answer {
  margin-top: 30px;
  font-size: 34px;
  opacity: 0;
  transition: 0.6s;
}

/* kategória */
#category {
  margin-top: 10px;
  font-size: 22px;
  opacity: 0;
  transition: 0.6s;
}

/* gomb */
button {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 26px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: white;
  color: black;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">
  <div id="spinner">...</div>
  <div id="answer"></div>
  <div id="category"></div>
</div>

<button onclick="goBack()">Kattkaland</button>

<script>
const params = new URLSearchParams(window.location.search);
const raw = params.get("data");

let item = null;

if (raw) {
  item = JSON.parse(decodeURIComponent(raw));
}

const spinnerEl = document.getElementById("spinner");
const answerEl = document.getElementById("answer");
const categoryEl = document.getElementById("category");

// 🔁 csak ezek forognak
const spinValues = ["Igen", "Nem", "Talán"];

let i = 0;
let interval;

// forgás indítás
function startSpin() {
  interval = setInterval(() => {
    spinnerEl.textContent = spinValues[i % spinValues.length];
    i++;
  }, 120);
}

// megállítás + eredmény
function stopSpin() {
  clearInterval(interval);

  setTimeout(() => {

    answerEl.textContent = item.answer;
    answerEl.style.opacity = 1;

    // kategória logika
    let typeText = "";

    if (item.type === "yes") typeText = "Igen";
    if (item.type === "no") typeText = "Nem";
    if (item.type === "maybe") typeText = "Talán";
    if (item.type === "clue") typeText = "Rejtély";

    // spinner marad “végső állapotban”
    if (item.type === "clue") {
      spinnerEl.textContent = "Rejtély";
    } else {
      spinnerEl.textContent = typeText;
    }

    categoryEl.textContent = typeText;
    categoryEl.style.opacity = 1;

  }, 500);
}

// indulás
startSpin();
setTimeout(stopSpin, 2500);

// vissza
function goBack() {
  window.location.href = "valaszorzo.html";
}
</script>

</body>
</html>
