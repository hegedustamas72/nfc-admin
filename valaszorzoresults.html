<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz Őrző</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: url("magic8.jpeg") center/cover no-repeat;
}

/* felső rész */
.top {
  position: absolute;
  top: 12%;
  width: 100%;
  text-align: center;
}

#spinner {
  font-size: 64px;
  font-weight: bold;
  height: 80px;
}

#category {
  font-size: 30px;
  margin-top: 10px;
}

/* alsó rész */
.bottom {
  position: absolute;
  bottom: 10%;
  width: 100%;
  text-align: center;
}

#answer {
  font-size: 34px;
  min-height: 50px;
}

/* instrukció szöveg */
#hint {
  margin: 18px 0;
  font-size: 16px;
  opacity: 0.85;
}

/* gomb */
button {
  padding: 16px 34px;
  font-size: 20px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: white;
  color: black;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="top">
  <div id="spinner">...</div>
  <div id="category"></div>
</div>

<div class="bottom">
  <div id="answer"></div>

  <div id="hint">
    Újabb válaszért érintsd újra a bilétát!
  </div>

  <button onclick="goBack()">Kattkaland</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const raw = params.get("data");

let item = null;

try {
  if (raw) item = JSON.parse(decodeURIComponent(raw));
} catch (e) {
  console.error("JSON hiba:", e);
}

function isValidItem(i) {
  return i && i.answer && i.answer.trim() !== "" && i.type;
}

if (!isValidItem(item)) {
  item = {
    answer: "Nincs válasz",
    type: "no"
  };
}

const spinValues = ["Igen", "Nem", "Talán"];

const spinnerEl = document.getElementById("spinner");
const categoryEl = document.getElementById("category");
const answerEl = document.getElementById("answer");

let i = 0;
let interval;

function mapType(type) {
  switch(type) {
    case "yes": return "Igen";
    case "no": return "Nem";
    case "maybe": return "Talán";
    case "clue": return "Rejtély";
    default: return "Ismeretlen";
  }
}

function startSpin() {
  interval = setInterval(() => {
    spinnerEl.textContent = spinValues[i % spinValues.length];
    i++;
  }, 120);
}

function stopSpin() {
  clearInterval(interval);

  setTimeout(() => {
    const mapped = mapType(item.type);

    // spinner végállapot
    spinnerEl.textContent = (item.type === "clue") ? "Rejtély" : mapped;

    // CSAK FELÜL KATEGÓRIA
    categoryEl.textContent = mapped;

    // válasz
    answerEl.textContent = item.answer;

  }, 500);
}

startSpin();
setTimeout(stopSpin, 2500);

function goBack() {
  window.location.href = "valaszorzo.html";
}
</script>

</body>
</html>
