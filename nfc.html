<body>
<div>Betöltés...</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

// Google Sheets
const SHEET_ID = "IDE_A_SHEET_ID"
const SHEET_NAME = "Munkalap1"

const SHEETS_URL =
  `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`

function randomSlug(){
  return Date.now() + "-" + Math.random().toString(36).substring(2,10)
}

function getMidnight(){
  const d = new Date()
  d.setHours(24,0,0,0)
  return d.toISOString()
}

async function run(){

  const res = await fetch(SHEETS_URL)
  const data = await res.json()

  if(!Array.isArray(data)){
    document.body.innerText = "Hiba: Google Sheets nem elérhető"
    return
  }

  const quotes = data
    .map(x => ({
      category: x.Kategória || "Idézet",
      text: x.Üzenet || "",
      author: x.Szerző || ""
    }))
    .filter(x => x.text)

  const quote =
    quotes[Math.floor(Math.random() * quotes.length)]

  const slug =
    randomSlug()

  const { error } = await supabase
    .from("daily_links")
    .insert({
      slug,
      quote: quote.text,
      author: quote.author,
      category: quote.category,
      expires_at: getMidnight()
    })

  if(error){
    document.body.innerText =
      "Supabase hiba: " + error.message
    return
  }

  window.location.href =
    "daily.html?slug=" + slug
}

run()

</script>

</body>
</html>
