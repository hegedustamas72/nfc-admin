<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const SHEET_ID = "1-iH4MYuNDCfi7C2weM59gY1J15bsbwxeHHFmJ2GA9PQ"
const SHEET_NAME = "Munkalap1"

const SHEETS_URL =
  `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`

const log = (msg) => {
  document.getElementById("log").innerText += "\n" + msg
}

function randomSlug(){
  return Math.random().toString(36).substring(2,10)
}

function getToday(){
  const d = new Date()
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate()
}

function getMidnight(){
  const d = new Date()
  d.setHours(24,0,0,0)
  return d.toISOString()
}

async function run(){

  log("📡 Google Sheets betöltés...")

  const res = await fetch(SHEETS_URL)
  const data = await res.json()

  log("✔ Sheets OK: " + data.length + " sor")

  const quotes = data.map(x => ({
    category: x.Kategória,
    text: x.Üzenet,
    author: x.Szerző
  })).filter(x => x.text)

  const quote =
    quotes[Math.floor(Math.random() * quotes.length)]

  log("🎲 Idézet kiválasztva: " + quote.text)

  const slug =
    Date.now() + "-" + randomSlug()

  log("🔑 Slug: " + slug)

  log("💾 Supabase insert...")

  const { data: inserted, error } = await supabase
    .from("daily_links")
    .insert({
      date_key: getToday(),
      slug,
      quote: quote.text,
      author: quote.author,
      category: quote.category,
      expires_at: getMidnight()
    })

  if(error){
    log("❌ SUPABASE ERROR:")
    log(JSON.stringify(error, null, 2))
    return
  }

  log("✔ INSERT OK")
  log("➡ Redirect...")

  window.location.href =
    "daily.html?slug=" + slug
}

run()

</script>
