<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// ======================
// SUPABASE
// ======================

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

// ======================
// TAG
// ======================

const tag =
  new URLSearchParams(window.location.search)
  .get("tag")

if (!tag) {

  document.body.innerHTML =
    "Hiányzó tag 😔"

  throw new Error("No tag")
}

// ======================
// LEJÁRAT = KÖVETKEZŐ HELYI ÉJFÉL
// ======================

const now = new Date()

const expires = new Date(
  now.getFullYear(),
  now.getMonth(),
  now.getDate() + 1,
  0,0,0,0
)

// ======================
// LEJÁRT SESSIONÖK TÖRLÉSE
// ======================

await supabase
  .from("daily_links")
  .delete()
  .eq("tag", tag)
  .lt("expires_at", new Date().toISOString())

// ======================
// VAN-E AKTÍV SESSION?
// ======================

const { data: existingRows, error: selectError } =
  await supabase
    .from("daily_links")
    .select("*")
    .eq("tag", tag)

if (selectError) {

  console.error(selectError)

  document.body.innerHTML =
    "Supabase SELECT hiba 😔"

  throw selectError
}

let existing = null

if (existingRows?.length) {

  existing = existingRows.find(row => {

    return new Date(row.expires_at) > new Date()

  })
}

// ======================
// HA VAN AKTÍV
// ======================

if (existing) {

  window.location.href =
    "daily.html?id=" + existing.session_id

  throw new Error("Existing session")
}

// ======================
// GOOGLE SHEETS
// ======================

const SHEET_URL =
  "https://opensheet.elk.sh/1-iH4MYuNDCfi7C2weM59gY1J15bsbwxeHHFmJ2GA9PQ/Munkalap1"

const response = await fetch(SHEET_URL)

const rows = await response.json()

if (!rows?.length) {

  document.body.innerHTML =
    "Nincsenek idézetek 😔"

  throw new Error("No rows")
}

// ======================
// RANDOM SOR
// ======================

const random =
  rows[Math.floor(Math.random() * rows.length)]

if (!random["Üzenet"]) {

  document.body.innerHTML =
    "Üres sor a Sheets-ben 😔"

  throw new Error("Empty row")
}

// ======================
// SESSION ID
// ======================

const sessionId =
  crypto.randomUUID()

// ======================
// INSERT
// ======================

const { error: insertError } =
  await supabase
    .from("daily_links")
    .insert({

      tag: tag,

      session_id: sessionId,

      quote: random["Üzenet"] || "",

      author: random["Szerző"] || "",

      category: random["Kategória"] || "",

      expires_at: expires.toISOString()
    })

if (insertError) {

  console.error(insertError)

  document.body.innerHTML = `
    <pre style="
      white-space:pre-wrap;
      padding:16px;
      font-size:12px;
    ">
${JSON.stringify(insertError, null, 2)}
    </pre>
  `

  throw insertError
}

// ======================
// REDIRECT
// ======================

window.location.href =
  "daily.html?id=" + sessionId

</script>

</body>
</html>
