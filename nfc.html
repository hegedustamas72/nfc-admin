<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// ======================
// SUPABASE
// ======================
const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

// ======================
// TAG
// ======================
const params = new URLSearchParams(window.location.search)
const tag = params.get("tag")

if (!tag) {
  document.body.innerHTML = "Hiányzó tag 😔"
  throw new Error("No tag")
}

// ======================
// MAI DÁTUM (HELYI)
// ======================
const now = new Date()

const today =
  now.getFullYear() + "-" +
  String(now.getMonth() + 1).padStart(2, "0") + "-" +
  String(now.getDate()).padStart(2, "0")

// ======================
// KÖVETKEZŐ ÉJFÉL (HELYI IDŐ)
// ======================
const expires = new Date(
  now.getFullYear(),
  now.getMonth(),
  now.getDate() + 1,
  0, 0, 0, 0
)

// ======================
// MEGLÉVŐ SESSION KERESÉS
// ======================
const { data: existingRows, error: selectError } = await supabase
  .from("daily_links")
  .select("*")
  .eq("tag", tag)
  .eq("date_key", today)

if (selectError) {
  console.error(selectError)
  document.body.innerHTML = "Supabase SELECT hiba 😔"
  throw selectError
}

let existing = null

if (existingRows && existingRows.length) {
  existing = existingRows.find(row =>
    new Date(row.expires_at) > new Date()
  )
}

// ======================
// HA VAN ÉRVÉNYES SESSION
// ======================
if (existing) {
  window.location.href = "daily.html?id=" + existing.session_id
  throw new Error("Existing session")
}

// ======================
// GOOGLE SHEETS
// ======================
const SHEET_URL =
  "https://opensheet.elk.sh/1-iH4MYuNDCfi7C2weM59gY1J15bsbwxeHHFmJ2GA9PQ/Munkalap1"

const res = await fetch(SHEET_URL)
const rows = await res.json()

if (!rows || !rows.length) {
  document.body.innerHTML = "Nincsenek idézetek 😔"
  throw new Error("No rows")
}

// ======================
// RANDOM IDÉZET
// ======================
const random = rows[Math.floor(Math.random() * rows.length)]

// ======================
// SESSION ID
// ======================
const sessionId = crypto.randomUUID()

// ======================
// INSERT
// ======================
const { error: insertError } = await supabase
  .from("daily_links")
  .insert({
    tag: tag,
    date_key: today,
    session_id: sessionId,
    quote: random.idezet || "",
    author: random.szerzo || "",
    category: random.kategoria || "",
    expires_at: expires.toISOString()
  })

if (insertError) {
  console.error(insertError)
  document.body.innerHTML = `
    <pre style="white-space:pre-wrap;padding:12px;">
${JSON.stringify(insertError, null, 2)}
    </pre>
  `
  throw insertError
}

// ======================
// REDIRECT
// ======================
window.location.href = "daily.html?id=" + sessionId

</script>

</body>
</html>
