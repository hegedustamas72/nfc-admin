<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// ======================
// SUPABASE
// ======================

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

// ======================
// TAG
// ======================

const params = new URLSearchParams(window.location.search)

const tag = params.get("tag")

if(!tag){

  document.body.innerHTML = "Hiányzó tag 😔"

  throw new Error("No tag")
}

// ======================
// MAI DÁTUM (HELYI IDŐ)
// ======================

const now = new Date()

const today =
  now.getFullYear() + "-" +
  String(now.getMonth()+1).padStart(2,"0") + "-" +
  String(now.getDate()).padStart(2,"0")

// ======================
// LEJÁRAT
// KÖVETKEZŐ HELYI ÉJFÉL
// ======================

const expires = new Date(
  now.getFullYear(),
  now.getMonth(),
  now.getDate() + 1,
  0,0,0,0
)

// ======================
// VAN-E MA MÁR SESSION?
// ======================

const { data: existingRows, error: existingError } = await supabase
  .from("daily_links")
  .select("*")
  .eq("tag", tag)
  .eq("date_key", today)

if(existingError){

  console.error(existingError)

  document.body.innerHTML =
    "Supabase hiba 😔"

  throw existingError
}

// ======================
// CSAK A NEM LEJÁRTAT KERESSÜK
// ======================

let existing = null

if(existingRows && existingRows.length){

  existing = existingRows.find(row => {

    return new Date(row.expires_at) > new Date()

  })
}

// ======================
// HA VAN AKTÍV MAI SESSION
// ======================

if(existing){

  window.location.href =
    "daily.html?id=" + existing.session_id

  throw new Error("Existing session")
}

// ======================
// GOOGLE SHEETS
// ======================

const SHEET_URL =
  "https://opensheet.elk.sh/1-iH4MYuNDCfi7C2weM59gY1J15bsbwxeHHFmJ2GA9PQ/Munkalap1"

const response = await fetch(SHEET_URL)

const rows = await response.json()

if(!rows.length){

  document.body.innerHTML =
    "Nincsenek idézetek 😔"

  throw new Error("No rows")
}

// ======================
// RANDOM IDÉZET
// ======================

const random =
  rows[Math.floor(Math.random() * rows.length)]

// ======================
// SESSION ID
// ======================

const sessionId =
  crypto.randomUUID()

// ======================
// SUPABASE INSERT
// ======================

const { error: insertError } = await supabase
  .from("daily_links")
  .insert({

    tag: tag,

    date_key: today,

    session_id: sessionId,

    quote: random.idezet || "",

    author: random.szerzo || "",

    category: random.kategoria || "",

    expires_at: expires.toISOString()
  })

if(insertError){

  console.error(insertError)

  document.body.innerHTML =
    "Supabase hiba 😔"

  throw insertError
}

// ======================
// REDIRECT
// ======================

window.location.href =
  "daily.html?id=" + sessionId

</script>

</body>
