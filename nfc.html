<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// ======================
// SUPABASE
// ======================
const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

// ======================
// TAG
// ======================
const params = new URLSearchParams(window.location.search)
const tag = params.get("tag")

if (!tag) {
  document.body.innerHTML = "Hiányzó tag 😔"
  throw new Error("No tag")
}

// ======================
// MAI DÁTUM
// ======================
const now = new Date()

const today =
  now.getFullYear() + "-" +
  String(now.getMonth()+1).padStart(2,"0") + "-" +
  String(now.getDate()).padStart(2,"0")

// ======================
// ÉJFÉL (LOCAL TIME)
// ======================
const expires = new Date(
  now.getFullYear(),
  now.getMonth(),
  now.getDate() + 1,
  0,0,0,0
)

// ======================
// CHECK EXISTING
// ======================
const { data: existingRows } = await supabase
  .from("daily_links")
  .select("*")
  .eq("tag", tag)
  .eq("date_key", today)

let existing = null

if (existingRows && existingRows.length) {
  existing = existingRows.find(r => Date.now() < r.expires_at)
}

if (existing) {
  window.location.href = "daily.html?id=" + existing.session_id
  throw new Error("Existing session")
}

// ======================
// SHEET
// ======================
const SHEET_URL =
  "https://opensheet.elk.sh/1-iH4MYuNDCfi7C2weM59gY1J15bsbwxeHHFmJ2GA9PQ/Munkalap1"

const res = await fetch(SHEET_URL)
const rows = await res.json()

if (!rows.length) {
  document.body.innerHTML = "Nincsenek idézetek 😔"
  throw new Error("No rows")
}

// ======================
// RANDOM
// ======================
const random = rows[Math.floor(Math.random() * rows.length)]

// ======================
// SESSION
// ======================
const sessionId = crypto.randomUUID()

// ======================
// INSERT (MILLISEC)
// ======================
const { error } = await supabase
  .from("daily_links")
  .insert({
    tag: tag,
    date_key: today,
    session_id: sessionId,
    quote: random["Üzenet"],
    author: random["Szerző"],
    category: random["Kategória"]
    expires_at: expires.getTime()
  })

if (error) {
  document.body.innerHTML = "Supabase hiba 😔"
  console.error(error)
  throw error
}

// ======================
// REDIRECT
// ======================
window.location.href = "daily.html?id=" + sessionId

</script>

</body>
</html>
