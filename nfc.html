<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// ======================
// SUPABASE
// ======================
const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

// ======================
// TAG
// ======================
const tag = new URLSearchParams(window.location.search).get("tag")

if (!tag) {
  document.body.innerHTML = "Hiányzó tag 😔"
  throw new Error("No tag")
}

// ======================
// MAI DÁTUM
// ======================
const now = new Date()

const today =
  now.getFullYear() + "-" +
  String(now.getMonth()+1).padStart(2,"0") + "-" +
  String(now.getDate()).padStart(2,"0")

// ======================
// ÉJFÉL (LOCAL)
// ======================
const expires = new Date(
  now.getFullYear(),
  now.getMonth(),
  now.getDate() + 1,
  0,0,0,0
)

// ======================
// EXISTING CHECK
// ======================
const { data: existingRows } = await supabase
  .from("daily_links")
  .select("*")
  .eq("tag", tag)
  .eq("date_key", today)

let existing = null

if (existingRows?.length) {
  existing = existingRows.find(r =>
    new Date(r.expires_at) > new Date()
  )
}

if (existing) {
  window.location.href = "daily.html?id=" + existing.session_id
  throw new Error("Existing session")
}

// ======================
// SHEETS
// ======================
const SHEET_URL =
  "https://opensheet.elk.sh/IDE_JÖN_A_SHEET_ID/Munkalap1"

const res = await fetch(SHEET_URL)
const rows = await res.json()

if (!rows.length) {
  document.body.innerHTML = "Nincsenek idézetek 😔"
  throw new Error("No rows")
}

// ======================
// RANDOM
// ======================
const random = rows[Math.floor(Math.random() * rows.length)]

// extra védelem
if (!random["Üzenet"]) {
  document.body.innerHTML = "Üres sor a Sheets-ben 😔"
  throw new Error("Empty row")
}

// ======================
// SESSION
// ======================
const sessionId = crypto.randomUUID()

// ======================
// INSERT (TIMESTAMP)
// ======================
const { error } = await supabase
  .from("daily_links")
  .insert({
    tag: tag,
    date_key: today,
    session_id: sessionId,

    quote: random["Üzenet"] || "",
    author: random["Szerző"] || "",
    category: random["Kategória"] || "",

    expires_at: expires.toISOString()
  })

if (error) {
  console.log("INSERT ERROR:", error)
  document.body.innerHTML = "Supabase hiba 😔"
  throw error
}

// ======================
// REDIRECT
// ======================
window.location.href = "daily.html?id=" + sessionId

</script>

</body>
</html>
