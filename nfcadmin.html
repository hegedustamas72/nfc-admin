<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>NFC Admin</title>

<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;600;700&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
}

html{
  width:100%;
  min-height:100%;
}

body{
  margin:0;

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  padding:
    max(14px, env(safe-area-inset-top))
    max(14px, env(safe-area-inset-right))
    max(14px, env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));

  font-family:'DM Sans',sans-serif;

  background:#f5f5f5;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#252525;
}

.card{
  width:min(100%,420px);

  background:white;

  padding:28px;

  border-radius:20px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,0.10);

  text-align:center;
}

h1{
  font-size:22px;
  line-height:1.2;

  margin:
    0
    0
    22px;
}

h2{
  font-size:17px;

  margin:
    0
    0
    14px;
}

input,
select{
  display:block;

  width:100%;

  padding:12px 13px;

  margin:9px 0;

  border-radius:11px;

  border:
    1px solid
    #cfcfcf;

  box-sizing:border-box;

  font-family:'DM Sans',sans-serif;

  font-size:16px;

  background:white;

  color:#252525;
}

button{
  width:100%;

  padding:13px 16px;

  margin-top:10px;

  border:none;

  border-radius:12px;

  cursor:pointer;

  font-family:'DM Sans',sans-serif;

  font-size:15px;

  font-weight:600;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

button:hover{
  transform:translateY(-1px);
}

button:active{
  transform:scale(.99);
}

button:disabled{
  opacity:.55;

  cursor:not-allowed;

  transform:none;
}

.login-btn{
  background:#9B6A6C;
  color:white;
}

.gen-btn{
  background:#424b54;
  color:white;
}

.copy-btn{
  background:#2e7d32;
  color:white;
}

.activate-btn{
  background:#c57a32;
  color:white;
}

.check-btn{
  background:#625a72;
  color:white;
}

.hidden{
  display:none !important;
}

.output{
  margin-top:15px;

  padding:12px;

  border-radius:11px;

  background:#f2f2f2;

  font-size:14px;

  line-height:1.4;

  overflow-wrap:anywhere;

  word-break:break-word;
}

.subtext{
  font-size:13px;

  color:#777;

  margin-top:7px;
}

.error{
  margin-top:12px;

  padding:11px;

  border-radius:11px;

  background:#fbeaea;

  color:#8f2f2f;

  font-size:13px;

  line-height:1.4;
}

.success{
  margin-top:12px;

  padding:11px;

  border-radius:11px;

  background:#edf7ee;

  color:#2e7d32;

  font-size:13px;

  line-height:1.4;
}

.test-info{
  margin-top:12px;

  padding:11px;

  border-radius:11px;

  background:#fff4e5;

  color:#8a531c;

  font-size:13px;

  line-height:1.45;
}

.status-box{
  margin-top:12px;

  padding:12px;

  border-radius:11px;

  background:#f2f2f2;

  text-align:left;

  font-size:14px;

  line-height:1.55;
}

.status-row{
  display:flex;

  justify-content:space-between;

  gap:12px;

  padding:3px 0;
}

.status-label{
  color:#777;
}

.status-value{
  font-weight:600;

  text-align:right;

  overflow-wrap:anywhere;
}

.divider{
  height:1px;

  margin:30px 0;

  background:#e7e7e7;
}

.existing-section{
  text-align:left;
}

.existing-section h2{
  text-align:center;
}

.helper{
  margin:
    0
    0
    10px;

  color:#777;

  font-size:13px;

  line-height:1.45;

  text-align:center;
}


/* =========================
   MOBIL
   ========================= */

@media (max-width:600px){

  body{
    align-items:flex-start;

    padding:
      max(12px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(18px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  .card{
    width:100%;

    padding:22px 16px;

    border-radius:18px;
  }

  h1{
    font-size:21px;

    margin-bottom:18px;
  }

  input,
  select{
    font-size:16px;
  }

  button{
    padding:13px 12px;

    font-size:15px;
  }

  .divider{
    margin:26px 0;
  }
}


/* =========================
   ALACSONY KIJELZŐ
   ========================= */

@media (max-height:700px){

  body{
    align-items:flex-start;
  }

  .card{
    margin:0 auto;
  }
}


/* =========================
   FEKVŐ MOBIL
   ========================= */

@media
  (orientation:landscape)
  and
  (max-height:550px){

  body{
    align-items:flex-start;
  }

  .card{
    max-width:500px;

    padding:18px;
  }

  h1{
    margin-bottom:14px;
  }

  .divider{
    margin:20px 0;
  }
}

</style>
</head>


<body>

<div class="card">


  <!-- ======================
       LOGIN
       ====================== -->

  <div id="loginBox">

    <h1>
      Admin belépés
    </h1>

    <input
      type="password"
      id="pass"
      placeholder="Jelszó"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()"
    >
      Belépés
    </button>

    <div
      id="loginError"
      class="error hidden"
    ></div>

  </div>



  <!-- ======================
       ADMIN
       ====================== -->

  <div
    id="adminBox"
    class="hidden"
  >

    <h1>
      NFC link generátor
    </h1>


    <!-- ======================
         ÚJ LINK GENERÁLÁSA
         ====================== -->

    <select id="category">

      <option value="motoros">
        Motoros
      </option>

      <option value="viking">
        Viking
      </option>

      <option value="kutya">
        Kutya
      </option>

      <option value="macska">
        Macska
      </option>

      <option value="pozitiv">
        Napi pozitív
      </option>

      <option value="artofwar">
        Art of War
      </option>

      <option value="bigbang">
        Agymenők
      </option>

      <option value="friends">
        Jóbarátok
      </option>

      <option value="valaszorzo">
        Válasz őrző
      </option>

      <option value="kedvesseg">
        Apró örömök
      </option>

      <option value="jelen">
        A Jelen Játéka
      </option>

      <option value="lelekviragzas">

      </option>

    <button

    <div

    ></div>


    <div

      id="copyBtn"

    <!-- ======================
         FRISSEN GENERÁLT
         LÉLEKVIRÁGZÁS
         ====================== -->

    <div
      id="testInfo"

    <!-- ======================

         ====================== -->

    <!-- ======================
         MEGLÉVŐ BILÉTA
         ====================== -->

      <p class="helper">

        vagy csak a tag azonosítóját.
      </p>


      <input
        type="text"

        placeholder="Biléta linkje vagy tag-je"
        autocomplete="off"

      >


      <button

        id="checkTagBtn"

      </button>

        class="error hidden"
      ></div>

        class="success hidden"
      ></div>


      <div
        id="existingStatus"
        class="status-box hidden"
      >

        <div class="status-row">

          <span class="status-label">
            Állapot

            class="status-value"

        <div class="status-row">

          <span class="status-label">
            Aktuális szint
          </span>

          <span
            class="status-value"
            id="statusMessage"
          ></span>

        </div>


        <div class="status-row">

          <span class="status-label">
            Aktív
          </span>

          <span
            class="status-value"

          ></span>

        </div>

      </div>


      <button

        Biléta élesítése
      </button>

</div>



<script>

// ========================================================
// EDGE FUNCTION
// ========================================================

const CREATE_AUDIO_TAG_URL =
  "https://eogrnzuarpqlyjclkcqq.supabase.co/functions/v1/create-audio-tag";



// ========================================================
// KATEGÓRIÁK
// ========================================================

const categories = {

  motoros:
    "motorosnfc.html",

  viking:
    "vikingnfc.html",

  kutya:
    "kutyanfc.html",

  macska:
    "catkalandnfc.html",

  pozitiv:
    "nfc.html",

  artofwar:
    "artofwarnfc.html",

  bigbang:
    "bigbangnfc.html",

  friends:
    "friendsnfc.html",

  valaszorzo:
    "valaszorzo.html",

  kedvesseg:
    "kedvessegnfc.html",

  jelen:
    "jelen.html",

  lelekviragzas:
    "lelekviragzas.html"

};



// ========================================================
// ADMIN JELSZÓ
// csak az oldal memóriájában
// ========================================================

let adminPassword = "";



// ========================================================
// FRISSEN GENERÁLT
// LÉLEKVIRÁGZÁS TAG
// ========================================================

let generatedAudioTag = null;



// ========================================================
// BEILLESZTETT / ELLENŐRZÖTT TAG
// ========================================================

let existingAudioTag = null;



// ========================================================
// EDGE FUNCTION HÍVÁS
// ========================================================

async function callCreateAudioTag(
  payload
){

  const response =
    await fetch(
      CREATE_AUDIO_TAG_URL,
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  let data = null;


  try{

    data =
      await response.json();

  }
  catch{

    data = {};

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      "Hiba történt a kérés során."
    );

  }


  return data;
}



// ========================================================
// LOGIN
// ========================================================

async function login(){

  const passInput =
    document.getElementById(
      "pass"
    );

  const loginBtn =
    document.getElementById(
      "loginBtn"
    );

  const loginError =
    document.getElementById(
      "loginError"
    );

  const password =
    passInput.value;


  loginError
    .classList
    .add("hidden");

  loginError.textContent =
    "";


  if(!password){

    loginError.textContent =
      "Add meg a jelszót.";

    loginError
      .classList
      .remove("hidden");

    return;

  }


  loginBtn.disabled =
    true;

  loginBtn.textContent =
    "Ellenőrzés…";


  try{

    await callCreateAudioTag({

      password:
        password,

      action:
        "verify"

    });


    adminPassword =
      password;


    passInput.value =
      "";


    document
      .getElementById(
        "loginBox"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "adminBox"
      )
      .classList
      .remove("hidden");

  }
  catch(error){

    loginError.textContent =
      error.message ||
      "Sikertelen belépés.";


    loginError
      .classList
      .remove("hidden");

  }
  finally{

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "Belépés";

  }
}



// ========================================================
// ENTER = LOGIN
// ========================================================

document
  .getElementById(
    "pass"
  )
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        login();

      }

    }
  );



// ========================================================
// RANDOM TAG
// normál bilétákhoz
// ========================================================

function randomTag(){

  return crypto.randomUUID();

}



// ========================================================
// GENERÁTOR KIMENET TÖRLÉSE
// ========================================================

function clearOutput(){

  document
    .getElementById(
      "result"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "copyBtn"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "generateMessage"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "generateError"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "testInfo"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "activateBtn"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "hint"
    )
    .textContent =
      "";


  window.generatedUrl =
    null;


  generatedAudioTag =
    null;

}



// ========================================================
// LINK MEGJELENÍTÉSE
// ========================================================

function showGeneratedUrl(
  url,
  categoryText
){

  window.generatedUrl =
    url;


  const result =
    document.getElementById(
      "result"
    );


  const copyBtn =
    document.getElementById(
      "copyBtn"
    );


  const hint =
    document.getElementById(
      "hint"
    );


  const nfcUrl =
    String(url)
      .replace(
        /^https?:\/\//,
        ""
      );


  result.textContent =
    nfcUrl;


  result
    .classList
    .remove("hidden");


  copyBtn
    .classList
    .remove("hidden");


  hint.textContent =
    "Kategória: " +
    categoryText;

}



// ========================================================
// LINK GENERÁLÁS
// ========================================================

async function generate(){

  clearOutput();


  const categorySelect =
    document.getElementById(
      "category"
    );


  const category =
    categorySelect.value;


  const categoryText =
    categorySelect
      .selectedOptions[0]
      .text;


  const generateBtn =
    document.getElementById(
      "generateBtn"
    );


  const generateMessage =
    document.getElementById(
      "generateMessage"
    );


  const generateError =
    document.getElementById(
      "generateError"
    );


  generateBtn.disabled =
    true;


  generateBtn.textContent =
    "Generálás…";


  try{


    // ====================================================
    // LÉLEKVIRÁGZÁS
    // ====================================================

    if(
      category ===
      "lelekviragzas"
    ){

      const data =
        await callCreateAudioTag({

          password:
            adminPassword,

          action:
            "create"

        });


      if(
        !data?.url ||
        !data?.tag
      ){

        throw new Error(
          "A biléta létrejött, de hiányos válasz érkezett."
        );

      }


      generatedAudioTag =
        data.tag;


      showGeneratedUrl(
        data.url,
        categoryText
      );


      generateMessage.textContent =
        "A Lélekvirágzás biléta létrejött teszt módban.";


      generateMessage
        .classList
        .remove("hidden");


      document
        .getElementById(
          "testInfo"
        )
        .classList
        .remove("hidden");


      document
        .getElementById(
          "activateBtn"
        )
        .classList
        .remove("hidden");


      return;

    }



    // ====================================================
    // TÖBBI NFC BILÉTA
    // ====================================================

    const tag =
      randomTag();


    const page =
      categories[
        category
      ];


    if(!page){

      throw new Error(
        "Ismeretlen kategória."
      );

    }


    const url =
      "https://vigyazzram.kattkaland.hu/" +
      page +
      "?tag=" +
      encodeURIComponent(
        tag
      );


    showGeneratedUrl(
      url,
      categoryText
    );

  }
  catch(error){

    console.error(
      error
    );


    generateError.textContent =
      error.message ||
      "Nem sikerült létrehozni a linket.";


    generateError
      .classList
      .remove("hidden");

  }
  finally{

    generateBtn.disabled =
      false;


    generateBtn.textContent =
      "Új link generálása";

  }

}



// ========================================================
// FRISSEN GENERÁLT
// BILÉTA ÉLESÍTÉSE
// ========================================================

async function activateGeneratedTag(){

  if(!generatedAudioTag){

    alert(
      "Nincs élesíthető Lélekvirágzás biléta."
    );

    return;

  }


  const confirmed =
    confirm(
      "Biztosan élesíted ezt a bilétát?\n\n" +
      "Élesítés után az 1. napi hang azonnal elérhetővé válik."
    );


  if(!confirmed){

    return;

  }


  const activateBtn =
    document.getElementById(
      "activateBtn"
    );


  const testInfo =
    document.getElementById(
      "testInfo"
    );


  const generateMessage =
    document.getElementById(
      "generateMessage"
    );


  const generateError =
    document.getElementById(
      "generateError"
    );


  activateBtn.disabled =
    true;


  activateBtn.textContent =
    "Élesítés…";


  generateError
    .classList
    .add("hidden");


  try{

    const data =
      await callCreateAudioTag({

        password:
          adminPassword,

        action:
          "activate",

        tag:
          generatedAudioTag

      });


    if(!data?.success){

      throw new Error(
        "Az élesítés nem sikerült."
      );

    }


    testInfo
      .classList
      .add("hidden");


    activateBtn
      .classList
      .add("hidden");


    generateMessage.textContent =
      "✓ A Lélekvirágzás biléta élesítve. Az 1. nap elérhető.";


    generateMessage
      .classList
      .remove("hidden");


    generatedAudioTag =
      null;

  }
  catch(error){

    console.error(
      error
    );


    generateError.textContent =
      error.message ||
      "Nem sikerült élesíteni a bilétát.";


    generateError
      .classList
      .remove("hidden");


    activateBtn.disabled =
      false;


    activateBtn.textContent =
      "Biléta élesítése";

  }

}



// ========================================================
// LINK / TAG KINYERÉSE
// ========================================================

function extractTag(
  value
){

  let input =
    String(
      value || ""
    )
    .trim();


  if(!input){

    return null;

  }


  /*
    Teljes URL vagy
    https:// nélküli URL.
  */

  if(
    input.includes(
      "tag="
    )
  ){

    try{

      let urlText =
        input;


      if(
        !/^https?:\/\//i
          .test(
            urlText
          )
      ){

        urlText =
          "https://" +
          urlText;

      }


      const url =
        new URL(
          urlText
        );


      const tag =
        url
          .searchParams
          .get(
            "tag"
          );


      if(tag){

        return tag.trim();

      }

    }
    catch{
      /*
        Ha a URL parser nem
        boldogul vele, még
        próbálunk regexet.
      */
    }


    const match =
      input.match(
        /(?:\?|&)tag=([^&#\s]+)/i
      );


    if(
      match &&
      match[1]
    ){

      try{

        return decodeURIComponent(
          match[1]
        )
        .trim();

      }
      catch{

        return match[1]
          .trim();

      }

    }

  }


  /*
    Ha csak maga a tag van
    beillesztve.
  */

  return input;

}



// ========================================================
// MEGLÉVŐ BILÉTA
// UI TÖRLÉSE
// ========================================================

function clearExistingStatus(){

  existingAudioTag =
    null;


  document
    .getElementById(
      "existingError"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "existingSuccess"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "existingStatus"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "activateExistingBtn"
    )
    .classList
    .add("hidden");

}



// ========================================================
// MEGLÉVŐ BILÉTA ELLENŐRZÉSE
// ========================================================

async function checkExistingTag(){

  clearExistingStatus();


  const input =
    document
      .getElementById(
        "existingTagInput"
      )
      .value;


  const tag =
    extractTag(
      input
    );


  const checkBtn =
    document.getElementById(
      "checkTagBtn"
    );


  const errorBox =
    document.getElementById(
      "existingError"
    );


  const successBox =
    document.getElementById(
      "existingSuccess"
    );


  const statusBox =
    document.getElementById(
      "existingStatus"
    );


  const activateBtn =
    document.getElementById(
      "activateExistingBtn"
    );


  if(!tag){

    errorBox.textContent =
      "Illeszd be a biléta linkjét vagy tag azonosítóját.";


    errorBox
      .classList
      .remove("hidden");


    return;

  }


  checkBtn.disabled =
    true;


  checkBtn.textContent =
    "Ellenőrzés…";


  try{

    const data =
      await callCreateAudioTag({

        password:
          adminPassword,

        action:
          "status",

        tag:
          tag

      });


    if(!data?.success){

      throw new Error(
        "Nem sikerült ellenőrizni a bilétát."
      );

    }


    existingAudioTag =
      tag;


    document
      .getElementById(
        "statusMode"
      )
      .textContent =
        data.test_mode
          ? "Teszt mód"
          : "Éles";


    document
      .getElementById(
        "statusActive"
      )
      .textContent =
        data.active
          ? "Igen"
          : "Nem";


    document
      .getElementById(
        "statusMessage"
      )
      .textContent =
        data.test_mode
          ? "Bevezető"
          : (
              data.current_message === 1
                ? "1. nap"
                : (
                    data.current_message +
                    ". nap"
                  )
            );


    statusBox
      .classList
      .remove("hidden");


    if(
      data.active === true &&
      data.test_mode === true
    ){

      successBox.textContent =
        "A biléta teszt módban van és élesíthető.";


      successBox
        .classList
        .remove("hidden");


      activateBtn
        .classList
        .remove("hidden");

    }
    else if(
      data.test_mode === false
    ){

      successBox.textContent =
        "✓ A biléta már élesítve van.";


      successBox
        .classList
        .remove("hidden");

    }
    else{

      errorBox.textContent =
        "A biléta jelenleg nem élesíthető.";


      errorBox
        .classList
        .remove("hidden");

    }

  }
  catch(error){

    console.error(
      error
    );


    errorBox.textContent =
      error.message ||
      "Nem sikerült ellenőrizni a bilétát.";


    errorBox
      .classList
      .remove("hidden");

  }
  finally{

    checkBtn.disabled =
      false;


    checkBtn.textContent =
      "Biléta ellenőrzése";

  }

}



// ========================================================
// BEILLESZTETT BILÉTA
// ÉLESÍTÉSE
// ========================================================

async function activateExistingTag(){

  if(!existingAudioTag){

    alert(
      "Előbb ellenőrizd a bilétát."
    );

    return;

  }


  const confirmed =
    confirm(
      "Biztosan élesíted ezt a bilétát?\n\n" +
      "Élesítés után az 1. napi hang azonnal elérhetővé válik."
    );


  if(!confirmed){

    return;

  }


  const activateBtn =
    document.getElementById(
      "activateExistingBtn"
    );


  const errorBox =
    document.getElementById(
      "existingError"
    );


  const successBox =
    document.getElementById(
      "existingSuccess"
    );


  activateBtn.disabled =
    true;


  activateBtn.textContent =
    "Élesítés…";


  errorBox
    .classList
    .add("hidden");


  try{

    const data =
      await callCreateAudioTag({

        password:
          adminPassword,

        action:
          "activate",

        tag:
          existingAudioTag

      });


    if(!data?.success){

      throw new Error(
        "Az élesítés nem sikerült."
      );

    }


    document
      .getElementById(
        "statusMode"
      )
      .textContent =
        "Éles";


    document
      .getElementById(
        "statusMessage"
      )
      .textContent =
        "1. nap";


    document
      .getElementById(
        "statusActive"
      )
      .textContent =
        "Igen";


    successBox.textContent =
      "✓ A biléta sikeresen élesítve. Az 1. nap elérhető.";


    successBox
      .classList
      .remove("hidden");


    activateBtn
      .classList
      .add("hidden");


    existingAudioTag =
      null;

  }
  catch(error){

    console.error(
      error
    );


    errorBox.textContent =
      error.message ||
      "Nem sikerült élesíteni a bilétát.";


    errorBox
      .classList
      .remove("hidden");


    activateBtn.disabled =
      false;


    activateBtn.textContent =
      "Biléta élesítése";

  }

}



// ========================================================
// LINK MÁSOLÁSA
//
// Az NFC-író app automatikusan
// eléteszi a https:// részt.
// ========================================================

async function copyLink(){

  if(
    !window.generatedUrl
  ){

    return;

  }


  const nfcUrl =
    String(
      window.generatedUrl
    )
    .replace(
      /^https?:\/\//,
      ""
    );


  try{

    await navigator
      .clipboard
      .writeText(
        nfcUrl
      );


    alert(
      "Link másolva ✔"
    );

  }
  catch(error){

    console.error(
      error
    );


    alert(
      "A link másolása nem sikerült."
    );

  }

}
