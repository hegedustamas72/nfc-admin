<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC Admin</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'DM Sans',sans-serif;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.card{
  background:white;
  padding:30px;
  border-radius:18px;
  width:min(90vw,400px);
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  text-align:center;
}

h1{
  font-size:20px;
  margin-bottom:20px;
}

input,
select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:0.2s ease;
}

button:hover{
  transform:translateY(-1px);
}

.login-btn{
  background:#9B6A6C;
  color:white;
}

.gen-btn{
  background:#424b54;
  color:white;
}

.copy-btn{
  background:#2e7d32;
  color:white;
}

.hidden{
  display:none;
}

.output{
  margin-top:15px;
  font-size:14px;
  word-break:break-all;
  background:#f2f2f2;
  padding:10px;
  border-radius:10px;
}

.subtext{
  font-size:12px;
  opacity:0.6;
  margin-top:5px;
}

</style>
</head>

<body>

<div class="card">

  <!-- LOGIN -->

  <div id="loginBox">

    <h1>Admin belépés</h1>

    <input
      type="password"
      id="pass"
      placeholder="Jelszó"
    >

    <button
      class="login-btn"
      onclick="login()"
    >
      Belépés
    </button>

  </div>

  <!-- ADMIN -->

  <div id="adminBox" class="hidden">

    <h1>NFC link generátor</h1>

    <select id="category">

      <option value="motoros">Motoros</option>
      <option value="viking">Viking</option>
      <option value="kutya">Kutya</option>
      <option value="macska">Macska</option>
      <option value="pozitiv">Napi pozitív</option>
      <option value="artofwar">Art of War</option>
      <option value="bigbang">Agymenők</option>
      <option value="friends">Jóbarátok</option>
      <option value="valaszorzo">Válasz őrző</option>

    </select>

    <button
      class="gen-btn"
      onclick="generate()"
    >
      Új link generálása
    </button>

    <div
      id="result"
      class="output hidden"
    ></div>

    <div
      class="subtext"
      id="hint"
    ></div>

    <button
      class="copy-btn hidden"
      id="copyBtn"
      onclick="copyLink()"
    >
      Link másolása
    </button>

  </div>

</div>

<script>

// ======================
// JELSZÓ
// ======================

const PASSWORD = "K4ttk4l4nd"

// ======================
// KATEGÓRIÁK
// ======================

const categories = {

  motoros: "motorosnfc.html",

  viking: "vikingnfc.html",

  kutya: "kutyanfc.html",

  macska: "catkalandnfc.html",

  pozitiv: "nfc.html",

  artofwar: "artofwarnfc.html",

  bigbang: "bigbangnfc.html",

  friends: "friendsnfc.html",

  valaszorzo: "valaszorzo.html"

}

// ======================
// LOGIN
// ======================

function login(){

  const pass =
    document.getElementById("pass").value

  if(pass !== PASSWORD){

    alert("Hibás jelszó")

    return
  }

  document
    .getElementById("loginBox")
    .classList.add("hidden")

  document
    .getElementById("adminBox")
    .classList.remove("hidden")
}

// ======================
// RANDOM TAG
// ======================

function randomTag(){

  return crypto.randomUUID()

}

// ======================
// LINK GENERÁLÁS
// ======================

function generate(){

  const tag =
    randomTag()

  const category =
    document.getElementById("category").value

  const page =
    categories[category]

  const url =
    "vigyazzram.kattkaland.hu/" +
    page +
    "?tag=" +
    tag

  window.generatedUrl = url

  const result =
    document.getElementById("result")

  const copyBtn =
    document.getElementById("copyBtn")

  const hint =
    document.getElementById("hint")

  result.textContent = url

  result.classList.remove("hidden")

  copyBtn.classList.remove("hidden")

  hint.textContent =
    "Kategória: " +
    document
      .getElementById("category")
      .selectedOptions[0]
      .text

}

// ======================
// MÁSOLÁS
// ======================

function copyLink(){

  navigator.clipboard
    .writeText(window.generatedUrl)

  alert("Link másolva ✔")

}

</script>

</body>
</html>
