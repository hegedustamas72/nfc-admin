<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>NFC Admin</title>

<!-- =========================
     APP / FŐKÉPERNYŐ IKON
     ========================= -->

<link
  rel="icon"
  type="image/png"
  href="brand-icon.png"
>

<link
  rel="apple-touch-icon"
  href="brand-icon.png"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="NFC Admin"
>

<meta
  name="theme-color"
  content="#9B6A6C"
>


<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;600;700&display=swap"
  rel="stylesheet"
>


<style>

*{
  box-sizing:border-box;
}

html{
  width:100%;
  min-height:100%;
}

body{
  margin:0;

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  padding:
    max(14px, env(safe-area-inset-top))
    max(14px, env(safe-area-inset-right))
    max(18px, env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));

  font-family:'DM Sans',sans-serif;

  background:#f5f5f5;

  display:flex;
  align-items:flex-start;
  justify-content:center;

  color:#252525;
}

.card{
  width:min(100%,420px);

  margin:auto;

  background:white;

  padding:26px;

  border-radius:20px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,0.10);

  text-align:center;
}

h1{
  font-size:22px;
  line-height:1.2;

  margin:
    0
    0
    22px;
}

h2{
  font-size:17px;

  margin:
    0
    0
    14px;
}

input,
select{
  display:block;

  width:100%;

  padding:12px 13px;

  margin:9px 0;

  border-radius:11px;

  border:1px solid #cfcfcf;

  font-family:'DM Sans',sans-serif;

  font-size:16px;

  background:white;

  color:#252525;
}

button{
  width:100%;

  padding:13px 16px;

  margin-top:10px;

  border:none;

  border-radius:12px;

  cursor:pointer;

  font-family:'DM Sans',sans-serif;

  font-size:15px;

  font-weight:600;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.login-btn{
  background:#9B6A6C;
  color:white;
}

.gen-btn{
  background:#424b54;
  color:white;
}

.copy-btn{
  background:#2e7d32;
  color:white;
}

.activate-btn{
  background:#c57a32;
  color:white;
}

.check-btn{
  background:#625a72;
  color:white;
}

.reset-btn{
  background:#9B6A6C;
  color:white;
}

.hidden{
  display:none !important;
}

.output{
  margin-top:15px;

  padding:12px;

  border-radius:11px;

  background:#f2f2f2;

  font-size:14px;

  line-height:1.4;

  overflow-wrap:anywhere;
}

.subtext{
  font-size:13px;

  color:#777;

  margin-top:7px;
}

.error{
  margin-top:12px;

  padding:11px;

  border-radius:11px;

  background:#fbeaea;

  color:#8f2f2f;

  font-size:13px;
}

.success{
  margin-top:12px;

  padding:11px;

  border-radius:11px;

  background:#edf7ee;

  color:#2e7d32;

  font-size:13px;
}

.test-info{
  margin-top:12px;

  padding:11px;

  border-radius:11px;

  background:#fff4e5;

  color:#8a531c;

  font-size:13px;

  line-height:1.45;
}

.status-box{
  margin-top:12px;

  padding:12px;

  border-radius:11px;

  background:#f2f2f2;

  text-align:left;

  font-size:14px;
}

.status-row{
  display:flex;

  justify-content:space-between;

  gap:12px;

  padding:4px 0;
}

.status-label{
  color:#777;
}

.status-value{
  font-weight:600;

  text-align:right;
}

.divider{
  height:1px;

  margin:28px 0;

  background:#e7e7e7;
}

.helper{
  margin:
    0
    0
    10px;

  color:#777;

  font-size:13px;

  line-height:1.45;
}


/* MOBIL */

@media(max-width:600px){

  body{
    padding:
      max(10px,env(safe-area-inset-top))
      max(10px,env(safe-area-inset-right))
      max(16px,env(safe-area-inset-bottom))
      max(10px,env(safe-area-inset-left));
  }

  .card{
    width:100%;
    padding:20px 15px;
    border-radius:18px;
  }

  h1{
    font-size:20px;
    margin-bottom:17px;
  }

  .divider{
    margin:23px 0;
  }

}


/* ALACSONY KIJELZŐ */

@media(max-height:700px){

  .card{
    margin:0 auto;
  }

}

</style>
</head>


<body>

<div class="card">


  <!-- LOGIN -->

  <div id="loginBox">

    <h1>
      Admin belépés
    </h1>

    <input
      type="password"
      id="pass"
      placeholder="Jelszó"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()"
    >
      Belépés
    </button>

    <div
      id="loginError"
      class="error hidden"
    ></div>

  </div>



  <!-- ADMIN -->

  <div
    id="adminBox"
    class="hidden"
  >

    <h1>
      NFC link generátor
    </h1>


    <select id="category">

      <option value="motoros">Motoros</option>
      <option value="viking">Viking</option>
      <option value="kutya">Kutya</option>
      <option value="macska">Macska</option>
      <option value="pozitiv">Napi pozitív</option>
      <option value="artofwar">Art of War</option>
      <option value="bigbang">Agymenők</option>
      <option value="friends">Jóbarátok</option>
      <option value="valaszorzo">Válasz őrző</option>
      <option value="kedvesseg">Apró örömök</option>
      <option value="jelen">A Jelen Játéka</option>
      <option value="lelekviragzas">Lélekvirágzás</option>

    </select>


    <button
      class="gen-btn"
      id="generateBtn"
      onclick="generate()"
    >
      Új link generálása
    </button>


    <div
      id="result"
      class="output hidden"
    ></div>

    <div
      class="subtext"
      id="hint"
    ></div>

    <div
      id="generateMessage"
      class="success hidden"
    ></div>

    <div
      id="generateError"
      class="error hidden"
    ></div>


    <button
      class="copy-btn hidden"
      id="copyBtn"
      onclick="copyLink()"
    >
      Link másolása
    </button>


    <div
      id="testInfo"
      class="test-info hidden"
    >
      A biléta jelenleg teszt módban van.
      Teszteléskor mindig a Bevezető hang marad elérhető.
    </div>


    <button
      class="activate-btn hidden"
      id="activateBtn"
      onclick="activateGeneratedTag()"
    >
      Biléta élesítése
    </button>



    <div class="divider"></div>



    <!-- MEGLÉVŐ BILÉTA -->

    <h2>
      Meglévő Lélekvirágzás biléta
    </h2>

    <p class="helper">
      Illeszd be a biléta teljes linkjét
      vagy csak a tag azonosítóját.
    </p>


    <input
      type="text"
      id="existingTagInput"
      placeholder="Biléta linkje vagy tag-je"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
    >


    <button
      class="check-btn"
      id="checkTagBtn"
      onclick="checkExistingTag()"
    >
      Biléta ellenőrzése
    </button>


    <div
      id="existingError"
      class="error hidden"
    ></div>

    <div
      id="existingSuccess"
      class="success hidden"
    ></div>


    <div
      id="existingStatus"
      class="status-box hidden"
    >

      <div class="status-row">

        <span class="status-label">
          Állapot
        </span>

        <span
          class="status-value"
          id="statusMode"
        ></span>

      </div>


      <div class="status-row">

        <span class="status-label">
          Aktuális szint
        </span>

        <span
          class="status-value"
          id="statusMessage"
        ></span>

      </div>


      <div class="status-row">

        <span class="status-label">
          Aktív
        </span>

        <span
          class="status-value"
          id="statusActive"
        ></span>

      </div>

    </div>


    <button
      class="activate-btn hidden"
      id="activateExistingBtn"
      onclick="activateExistingTag()"
    >
      Biléta élesítése
    </button>


    <button
      class="reset-btn hidden"
      id="resetExistingBtn"
      onclick="resetExistingTag()"
    >
      Visszaállítás teszt módba
    </button>


  </div>

</div>



<script>

const CREATE_AUDIO_TAG_URL =
  "https://eogrnzuarpqlyjclkcqq.supabase.co/functions/v1/create-audio-tag";


const categories = {

  motoros:"motorosnfc.html",

  viking:"vikingnfc.html",

  kutya:"kutyanfc.html",

  macska:"catkalandnfc.html",

  pozitiv:"nfc.html",

  artofwar:"artofwarnfc.html",

  bigbang:"bigbangnfc.html",

  friends:"friendsnfc.html",

  valaszorzo:"valaszorzo.html",

  kedvesseg:"kedvessegnfc.html",

  jelen:"jelen.html",

  lelekviragzas:
    "lelekviragzas.html"

};


let adminPassword = "";

let generatedAudioTag = null;

let existingAudioTag = null;



async function callCreateAudioTag(
  payload
){

  const response =
    await fetch(
      CREATE_AUDIO_TAG_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  let data = {};


  try{

    data =
      await response.json();

  }
  catch{}


  if(!response.ok){

    throw new Error(
      data.error ||
      "Hiba történt a kérés során."
    );

  }


  return data;

}



// LOGIN

async function login(){

  const password =
    document
      .getElementById("pass")
      .value;


  const button =
    document
      .getElementById("loginBtn");


  const error =
    document
      .getElementById("loginError");


  error.classList.add("hidden");


  if(!password){

    error.textContent =
      "Add meg a jelszót.";

    error.classList.remove("hidden");

    return;

  }


  button.disabled = true;

  button.textContent =
    "Ellenőrzés…";


  try{

    await callCreateAudioTag({

      password,
      action:"verify"

    });


    adminPassword =
      password;


    document
      .getElementById("pass")
      .value =
        "";


    document
      .getElementById("loginBox")
      .classList
      .add("hidden");


    document
      .getElementById("adminBox")
      .classList
      .remove("hidden");

  }
  catch(err){

    error.textContent =
      err.message;

    error.classList.remove("hidden");

  }
  finally{

    button.disabled = false;

    button.textContent =
      "Belépés";

  }

}


document
  .getElementById("pass")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        login();

      }

    }
  );



// RANDOM TAG

function randomTag(){

  return crypto.randomUUID();

}



// GENERÁTOR RESET

function clearOutput(){

  [
    "result",
    "copyBtn",
    "generateMessage",
    "generateError",
    "testInfo",
    "activateBtn"
  ]
  .forEach(
    id =>
      document
        .getElementById(id)
        .classList
        .add("hidden")
  );


  document
    .getElementById("hint")
    .textContent =
      "";


  window.generatedUrl =
    null;


  generatedAudioTag =
    null;

}



// LINK MEGJELENÍTÉS

function showGeneratedUrl(
  url,
  categoryText
){

  window.generatedUrl =
    url;


  const nfcUrl =
    String(url)
      .replace(
        /^https?:\/\//,
        ""
      );


  const result =
    document
      .getElementById("result");


  result.textContent =
    nfcUrl;


  result
    .classList
    .remove("hidden");


  document
    .getElementById("copyBtn")
    .classList
    .remove("hidden");


  document
    .getElementById("hint")
    .textContent =
      "Kategória: " +
      categoryText;

}



// GENERÁLÁS

async function generate(){

  clearOutput();


  const categorySelect =
    document
      .getElementById("category");


  const category =
    categorySelect.value;


  const categoryText =
    categorySelect
      .selectedOptions[0]
      .text;


  const button =
    document
      .getElementById("generateBtn");


  const message =
    document
      .getElementById("generateMessage");


  const error =
    document
      .getElementById("generateError");


  button.disabled =
    true;


  button.textContent =
    "Generálás…";


  try{


    if(
      category ===
      "lelekviragzas"
    ){

      const data =
        await callCreateAudioTag({

          password:
            adminPassword,

          action:
            "create"

        });


      generatedAudioTag =
        data.tag;


      showGeneratedUrl(
        data.url,
        categoryText
      );


      message.textContent =
        "A Lélekvirágzás biléta létrejött teszt módban.";


      message
        .classList
        .remove("hidden");


      document
        .getElementById("testInfo")
        .classList
        .remove("hidden");


      document
        .getElementById("activateBtn")
        .classList
        .remove("hidden");


      return;

    }


    const tag =
      randomTag();


    const url =
      "https://vigyazzram.kattkaland.hu/" +
      categories[category] +
      "?tag=" +
      encodeURIComponent(tag);


    showGeneratedUrl(
      url,
      categoryText
    );

  }
  catch(err){

    error.textContent =
      err.message;


    error
      .classList
      .remove("hidden");

  }
  finally{

    button.disabled =
      false;


    button.textContent =
      "Új link generálása";

  }

}



// FRISS GENERÁLT ÉLESÍTÉS

async function activateGeneratedTag(){

  if(!generatedAudioTag){
    return;
  }


  if(
    !confirm(
      "Biztosan élesíted ezt a bilétát?\n\n" +
      "Élesítés után az 1. napi hang azonnal elérhető."
    )
  ){
    return;
  }


  try{

    await callCreateAudioTag({

      password:
        adminPassword,

      action:
        "activate",

      tag:
        generatedAudioTag

    });


    document
      .getElementById("testInfo")
      .classList
      .add("hidden");


    document
      .getElementById("activateBtn")
      .classList
      .add("hidden");


    const message =
      document
        .getElementById("generateMessage");


    message.textContent =
      "✓ A biléta élesítve. Az 1. nap elérhető.";


    message
      .classList
      .remove("hidden");


    generatedAudioTag =
      null;

  }
  catch(err){

    const error =
      document
        .getElementById("generateError");


    error.textContent =
      err.message;


    error
      .classList
      .remove("hidden");

  }

}



// TAG KINYERÉS LINKBŐL

function extractTag(value){

  const input =
    String(value || "")
      .trim();


  if(!input){
    return null;
  }


  if(
    input.includes("tag=")
  ){

    try{

      let text =
        input;


      if(
        !/^https?:\/\//i
          .test(text)
      ){

        text =
          "https://" +
          text;

      }


      const url =
        new URL(text);


      const tag =
        url.searchParams
          .get("tag");


      if(tag){

        return tag.trim();

      }

    }
    catch{}


    const match =
      input.match(
        /(?:\?|&)tag=([^&#\s]+)/i
      );


    if(match?.[1]){

      return decodeURIComponent(
        match[1]
      )
      .trim();

    }

  }


  return input;

}



// MEGLÉVŐ UI RESET

function clearExisting(){

  existingAudioTag =
    null;


  [
    "existingError",
    "existingSuccess",
    "existingStatus",
    "activateExistingBtn",
    "resetExistingBtn"
  ]
  .forEach(
    id =>
      document
        .getElementById(id)
        .classList
        .add("hidden")
  );

}



// MEGLÉVŐ ELLENŐRZÉS

async function checkExistingTag(){

  clearExisting();


  const tag =
    extractTag(
      document
        .getElementById(
          "existingTagInput"
        )
        .value
    );


  const button =
    document
      .getElementById("checkTagBtn");


  const error =
    document
      .getElementById("existingError");


  const success =
    document
      .getElementById("existingSuccess");


  if(!tag){

    error.textContent =
      "Illeszd be a biléta linkjét vagy tag-jét.";


    error
      .classList
      .remove("hidden");


    return;

  }


  button.disabled =
    true;


  button.textContent =
    "Ellenőrzés…";


  try{

    const data =
      await callCreateAudioTag({

        password:
          adminPassword,

        action:
          "status",

        tag:
          tag

      });


    existingAudioTag =
      tag;


    document
      .getElementById("statusMode")
      .textContent =
        data.test_mode
          ? "Teszt mód"
          : "Éles";


    document
      .getElementById("statusActive")
      .textContent =
        data.active
          ? "Igen"
          : "Nem";


    document
      .getElementById("statusMessage")
      .textContent =
        data.test_mode
          ? "Bevezető"
          : data.current_message +
            ". nap";


    document
      .getElementById("existingStatus")
      .classList
      .remove("hidden");


    if(
      data.active &&
      data.test_mode
    ){

      success.textContent =
        "A biléta teszt módban van.";


      success
        .classList
        .remove("hidden");


      document
        .getElementById(
          "activateExistingBtn"
        )
        .classList
        .remove("hidden");

    }
    else if(
      data.active &&
      !data.test_mode
    ){

      success.textContent =
        "✓ A biléta éles állapotban van.";


      success
        .classList
        .remove("hidden");


      document
        .getElementById(
          "resetExistingBtn"
        )
        .classList
        .remove("hidden");

    }

  }
  catch(err){

    error.textContent =
      err.message;


    error
      .classList
      .remove("hidden");

  }
  finally{

    button.disabled =
      false;


    button.textContent =
      "Biléta ellenőrzése";

  }

}



// MEGLÉVŐ ÉLESÍTÉS

async function activateExistingTag(){

  if(!existingAudioTag){
    return;
  }


  if(
    !confirm(
      "Biztosan élesíted ezt a bilétát?\n\n" +
      "Az 1. nap azonnal elérhetővé válik."
    )
  ){
    return;
  }


  try{

    await callCreateAudioTag({

      password:
        adminPassword,

      action:
        "activate",

      tag:
        existingAudioTag

    });


    await checkExistingTag();

  }
  catch(err){

    alert(
      err.message
    );

  }

}



// MEGLÉVŐ RESET

async function resetExistingTag(){

  if(!existingAudioTag){
    return;
  }


  if(
    !confirm(
      "Biztosan visszaállítod ezt a bilétát teszt módba?\n\n" +
      "A jelenlegi előrehaladás törlődik, és ismét csak a Bevezető lesz elérhető."
    )
  ){
    return;
  }


  try{

    await callCreateAudioTag({

      password:
        adminPassword,

      action:
        "reset",

      tag:
        existingAudioTag

    });


    await checkExistingTag();

  }
  catch(err){

    alert(
      err.message
    );

  }

}



// LINK MÁSOLÁS

async function copyLink(){

  if(
    !window.generatedUrl
  ){
    return;
  }


  const nfcUrl =
    String(
      window.generatedUrl
    )
    .replace(
      /^https?:\/\//,
      ""
    );


  try{

    await navigator
      .clipboard
      .writeText(
        nfcUrl
      );


    alert(
      "Link másolva ✔"
    );

  }
  catch{

    alert(
      "A link másolása nem sikerült."
    );

  }

}

</script>

</body>
</html>
