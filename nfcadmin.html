<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC Admin</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'DM Sans',sans-serif;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.card{
  background:white;
  padding:30px;
  border-radius:18px;
  width:min(90vw,400px);
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  text-align:center;
}

h1{
  font-size:20px;
  margin-bottom:20px;
}

input,
select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
  font-family:'DM Sans',sans-serif;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  font-family:'DM Sans',sans-serif;
  transition:0.2s ease;
}

button:hover{
  transform:translateY(-1px);
}

button:disabled{
  opacity:0.55;
  cursor:not-allowed;
  transform:none;
}

.login-btn{
  background:#9B6A6C;
  color:white;
}

.gen-btn{
  background:#424b54;
  color:white;
}

.copy-btn{
  background:#2e7d32;
  color:white;
}

.hidden{
  display:none;
}

.output{
  margin-top:15px;
  font-size:14px;
  word-break:break-all;
  background:#f2f2f2;
  padding:10px;
  border-radius:10px;
}

.subtext{
  font-size:12px;
  opacity:0.6;
  margin-top:5px;
}

.error{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#fbeaea;
  color:#8f2f2f;
  font-size:13px;
}

.success{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#edf7ee;
  color:#2e7d32;
  font-size:13px;
}

</style>
</head>

<body>

<div class="card">

  <!-- LOGIN -->

  <div id="loginBox">

    <h1>Admin belépés</h1>

    <input
      type="password"
      id="pass"
      placeholder="Jelszó"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()"
    >
      Belépés
    </button>

    <div
      id="loginError"
      class="error hidden"
    ></div>

  </div>


  <!-- ADMIN -->

  <div id="adminBox" class="hidden">

    <h1>NFC link generátor</h1>

    <select id="category">

      <option value="motoros">Motoros</option>
      <option value="viking">Viking</option>
      <option value="kutya">Kutya</option>
      <option value="macska">Macska</option>
      <option value="pozitiv">Napi pozitív</option>
      <option value="artofwar">Art of War</option>
      <option value="bigbang">Agymenők</option>
      <option value="friends">Jóbarátok</option>
      <option value="valaszorzo">Válasz őrző</option>
      <option value="kedvesseg">Apró örömök</option>
      <option value="jelen">A Jelen Játéka</option>

      <option value="lelekviragzas">
        Lélekvirágzás
      </option>

    </select>

    <button
      class="gen-btn"
      id="generateBtn"
      onclick="generate()"
    >
      Új link generálása
    </button>

    <div
      id="result"
      class="output hidden"
    ></div>

    <div
      class="subtext"
      id="hint"
    ></div>

    <div
      id="generateMessage"
      class="success hidden"
    ></div>

    <div
      id="generateError"
      class="error hidden"
    ></div>

    <button
      class="copy-btn hidden"
      id="copyBtn"
      onclick="copyLink()"
    >
      Link másolása
    </button>

  </div>

</div>


<script>

// ======================
// EDGE FUNCTION
// ======================

const CREATE_AUDIO_TAG_URL =
  "https://eogrnzuarpqlyjclkcqq.supabase.co/functions/v1/create-audio-tag";


// ======================
// KATEGÓRIÁK
// ======================

const categories = {

  motoros: "motorosnfc.html",

  viking: "vikingnfc.html",

  kutya: "kutyanfc.html",

  macska: "catkalandnfc.html",

  pozitiv: "nfc.html",

  artofwar: "artofwarnfc.html",

  bigbang: "bigbangnfc.html",

  friends: "friendsnfc.html",

  valaszorzo: "valaszorzo.html",

  kedvesseg: "kedvessegnfc.html",

  jelen: "jelen.html",

  lelekviragzas: "lelekviragzas.html"

};


// ======================
// AKTUÁLIS ADMIN JELSZÓ
// csak memóriában
// ======================

let adminPassword = "";


// ======================
// EDGE FUNCTION HÍVÁS
// ======================

async function callCreateAudioTag(payload){

  const response =
    await fetch(
      CREATE_AUDIO_TAG_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:
          JSON.stringify(payload)
      }
    );

  let data = null;

  try{
    data =
      await response.json();
  }
  catch{
    data = {};
  }

  if(!response.ok){

    throw new Error(
      data.error ||
      "Hiba történt a kérés során."
    );
  }

  return data;
}


// ======================
// LOGIN
// ======================

async function login(){

  const passInput =
    document.getElementById("pass");

  const loginBtn =
    document.getElementById("loginBtn");

  const loginError =
    document.getElementById("loginError");

  const password =
    passInput.value;

  loginError.classList.add("hidden");
  loginError.textContent = "";

  if(!password){

    loginError.textContent =
      "Add meg a jelszót.";

    loginError.classList.remove("hidden");

    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent =
    "Ellenőrzés…";

  try{

    await callCreateAudioTag({
      password:password,
      action:"verify"
    });

    adminPassword =
      password;

    passInput.value = "";

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");

  }
  catch(error){

    loginError.textContent =
      error.message ||
      "Sikertelen belépés.";

    loginError.classList.remove("hidden");

  }
  finally{

    loginBtn.disabled = false;
    loginBtn.textContent =
      "Belépés";
  }
}


// ======================
// ENTER = BELÉPÉS
// ======================

document
  .getElementById("pass")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){
        login();
      }

    }
  );


// ======================
// RANDOM TAG
// normál bilétákhoz
// ======================

function randomTag(){

  return crypto.randomUUID();

}


// ======================
// KIMENET TÖRLÉSE
// ======================

function clearOutput(){

  document
    .getElementById("result")
    .classList.add("hidden");

  document
    .getElementById("copyBtn")
    .classList.add("hidden");

  document
    .getElementById("generateMessage")
    .classList.add("hidden");

  document
    .getElementById("generateError")
    .classList.add("hidden");

  document
    .getElementById("hint")
    .textContent = "";

  window.generatedUrl = null;
}


// ======================
// LINK MEGJELENÍTÉSE
// ======================

function showGeneratedUrl(
  url,
  categoryText
){

  window.generatedUrl =
    url;

  const result =
    document.getElementById("result");

  const copyBtn =
    document.getElementById("copyBtn");

  const hint =
    document.getElementById("hint");

  result.textContent =
    url;

  result.classList.remove("hidden");

  copyBtn.classList.remove("hidden");

  hint.textContent =
    "Kategória: " +
    categoryText;
}


// ======================
// LINK GENERÁLÁS
// ======================

async function generate(){

  clearOutput();

  const categorySelect =
    document.getElementById("category");

  const category =
    categorySelect.value;

  const categoryText =
    categorySelect
      .selectedOptions[0]
      .text;

  const generateBtn =
    document.getElementById(
      "generateBtn"
    );

  const generateMessage =
    document.getElementById(
      "generateMessage"
    );

  const generateError =
    document.getElementById(
      "generateError"
    );


  generateBtn.disabled = true;
  generateBtn.textContent =
    "Generálás…";


  try{

    // ==================================
    // LÉLEKVIRÁGZÁS
    // Supabase rekord is készül
    // ==================================

    if(category === "lelekviragzas"){

      const data =
        await callCreateAudioTag({
          password:
            adminPassword,

          action:
            "create"
        });


      if(!data?.url){

        throw new Error(
          "A biléta létrejött, de nem érkezett vissza link."
        );
      }


      showGeneratedUrl(
        data.url,
        categoryText
      );


      generateMessage.textContent =
        "A Lélekvirágzás biléta létrejött és aktiválásra kész.";

      generateMessage
        .classList
        .remove("hidden");

      return;
    }


    // ==================================
    // TÖBBI NFC BILÉTA
    // régi működés
    // ==================================

    const tag =
      randomTag();

    const page =
      categories[category];

    if(!page){

      throw new Error(
        "Ismeretlen kategória."
      );
    }


    const url =
      "https://vigyazzram.kattkaland.hu/" +
      page +
      "?tag=" +
      encodeURIComponent(tag);


    showGeneratedUrl(
      url,
      categoryText
    );

  }
  catch(error){

    console.error(error);

    generateError.textContent =
      error.message ||
      "Nem sikerült létrehozni a linket.";

    generateError
      .classList
      .remove("hidden");

  }
  finally{

    generateBtn.disabled = false;
    generateBtn.textContent =
      "Új link generálása";
  }
}


// ======================
// MÁSOLÁS
// ======================

async function copyLink(){

  if(!window.generatedUrl){
    return;
  }

  try{

    await navigator.clipboard
      .writeText(
        window.generatedUrl
      );

    alert(
      "Link másolva ✔"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "A link másolása nem sikerült."
    );
  }
}

</script>

</body>
</html>
