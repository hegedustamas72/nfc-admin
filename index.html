<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Okosbiléta</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

/* ===== HÁTTÉR ===== */

body{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-end;

    background-image:url('Okosbiléta plakát kicsi.jpg');
    background-repeat:no-repeat;
    background-position:center center;

    /* Dinamikus méretezés */
    background-size:contain;

    background-color:#edf1f2;
}

/* ===== SÖTÉT ALSÓ ÁTMENET ===== */

body::after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:20%;

    background:linear-gradient(
        to top,
        rgba(0,0,0,0.18),
        rgba(0,0,0,0)
    );

    pointer-events:none;
}

/* ===== GOMB ===== */

.button-container{
    position:absolute;
    bottom:4vh;
    z-index:5;
    width:100%;
    display:flex;
    justify-content:center;
}

.order-button{
    text-decoration:none;

    background:rgba(211,154,166,0.92);
    color:white;

    padding:1rem 2.8rem;

    border-radius:60px;

    font-weight:700;

    box-shadow:0 8px 22px rgba(0,0,0,0.25);

    transition:all 0.25s ease;

    border:2px solid rgba(255,255,255,0.7);

    backdrop-filter:blur(5px);

    /* Reszponzív betűméret */
    font-size:clamp(1rem, 2vw, 1.5rem);

    letter-spacing:0.5px;
}

.order-button:hover{
    transform:scale(1.05);
    background:rgba(193,131,145,0.96);
}

/* ===== MOBIL ===== */

@media (max-width: 768px){

    body{
        background-size:cover;
        background-position:center top;
    }

    .button-container{
        bottom:3vh;
    }

    .order-button{
        width:85%;
        text-align:center;
        padding:1rem;
        border-radius:22px;
    }
}

/* ===== TABLET ===== */

@media (min-width: 769px) and (max-width: 1200px){

    body{
        background-size:contain;
    }

    .order-button{
        padding:1rem 3rem;
    }
}

/* ===== NAGY KIJELZŐ ===== */

@media (min-width: 1600px){

    body{
        background-size:auto 100%;
    }

    .order-button{
        font-size:1.7rem;
        padding:1.2rem 4rem;
    }
}

</style>
</head>

<body>

<div class="button-container">
    <a href="index2.html" class="order-button">
        Megrendelés
    </a>
</div>

</body>
</html>
