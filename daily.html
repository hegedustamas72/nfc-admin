<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Napi pozitív</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&family=Alex+Brush&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  box-sizing:border-box;
  background:#f5f5f5;
}

.card{
  background: rgba(255,255,255,0.5);
  padding:28px;
  border-radius:24px;
  width:min(100%, 380px);
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,0.1);
}

.title{
  font-family:'Alex Brush',cursive;
  font-size:42px;
  margin:0;
}

.tag{
  font-size:12px;
  opacity:.6;
  margin-top:10px;
}

.message{
  font-size:24px;
  font-weight:700;
  margin:20px 0;
}

.author{
  text-align:right;
  font-size:14px;
  opacity:.7;
  font-style:italic;
  width:100%;
}

.error{
  color:#b00020;
  font-weight:700;
}

</style>
</head>

<body>

<div class="card">

  <div class="title">Napi pozitív</div>

  <div id="content">Betöltés...</div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const params = new URLSearchParams(window.location.search)
const sessionId = params.get("id")

const content = document.getElementById("content")

if (!sessionId) {
  content.innerHTML = `<div class="error">Hiányzó azonosító 😔</div>`
  throw new Error("No session")
}

const { data, error } = await supabase
  .from("daily_links")
  .select("*")
  .eq("session_id", sessionId)
  .maybeSingle()

if (error || !data) {
  content.innerHTML = `<div class="error">Nem található 😔</div>`
  throw error
}

// ======================
// LEJÁRAT CHECK (ÉJFÉL ALAPÚ)
// ======================
const now = new Date()
const expiresAt = new Date(data.expires_at)

if (!data.expires_at || now >= expiresAt) {
  content.innerHTML = `
    <div class="error">
      Sajnos ez a napi üzenet már lejárt!<br><br>
      Olvasd be újra a bilétát ✨
    </div>
  `
  throw new Error("Expired")
}

// ======================
// MEGJELENÍTÉS
// ======================
content.innerHTML = `
  <div class="tag">${data.category || ""}</div>
  <div class="message">${data.quote}</div>
  ${data.author ? `<div class="author">— ${data.author}</div>` : ""}
`

</script>

</body>
</html>
