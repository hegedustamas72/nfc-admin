<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Napi pozitív</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&family=Alex+Brush&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  padding:20px;

  font-family:'DM Sans',sans-serif;

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)),
    url('szivhatter.jpg');

  background-size:cover;
  background-position:center;
}

.card{
  background: rgba(255,255,255,0.5);

  padding:28px;

  border-radius:24px;

  width:min(90vw,380px);

  box-shadow:0 12px 30px rgba(0,0,0,0.1);

  text-align:center;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}

.title{
  font-family:'Alex Brush',cursive;
  font-size:42px;
}

.tag{
  font-size:12px;
  opacity:.6;
}

.message{
  font-size:24px;
  font-weight:700;
  line-height:1.4;
}

.author{
  width:100%;
  text-align:right;

  font-size:14px;
  opacity:.7;

  font-style:italic;

  padding-right:8px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-family:'Alex Brush',cursive;
  padding:12px 18px;
  border-radius:14px;

  border:1px solid #9B6A6C;

  background:#9B6A6C;
  color:#ffffff;

  text-decoration:none;
  font-weight:600;

  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}
.btn img{
  width:18px;
  height:18px;
}

</style>
</head>

<body>

<div class="card">

  <div class="title">Napi pozitív</div>

  <div id="content">Betöltés...</div>

  <a class="btn" href="index2.html">
    <img src="brand-icon.png">
    Kattkaland
  </a>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const id =
  new URLSearchParams(window.location.search)
  .get("id")

async function load(){

  const { data } = await supabase
    .from("daily_links")
    .select("*")
    .eq("session_id", id)
    .maybeSingle()

  const el =
    document.getElementById("content")

  if(!data){
    el.innerHTML = "Nem található 😔"
    return
  }

  // ===== LEJÁRT? =====

  if(new Date() > new Date(data.expires_at)){

    el.innerHTML =
      "Ez a napi üzenet már lejárt 🌙<br><br>" +
      "Olvasd be újra az NFC taget 😊"

    return
  }

  // ===== MEGJELENÍTÉS =====

  el.innerHTML = `
    <div class="tag">${data.category || ""}</div>

    <div class="message">
      ${data.quote}
    </div>

    ${data.author
      ? `<div class="author">— ${data.author}</div>`
      : ""
    }
  `
}

load()

</script>

</body>
</html>
