<!DOCTYPE html>

<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Válasz őrző</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  min-height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("magic8.jpeg");

  background-size:cover;
  background-position:center;

  color:white;
  font-family:"DM Sans",sans-serif;
}

/* TOP */
.top{
  padding-top:30px;
  text-align:center;
}

.category{
  font-size:14px;
  opacity:.75;
  letter-spacing:2px;
  margin-bottom:10px;
}

.big{
  font-size:40px;
  font-weight:700;
  min-height:50px;
}

/* BOTTOM */
.bottom{
  text-align:center;
  padding-bottom:40px;
}

.answer{
  font-size:26px;
  font-weight:600;
  margin-bottom:10px;
}

.hint{
  font-size:13px;
  opacity:.7;
  margin-bottom:20px;
}

.btn{
  display:inline-block;
  padding:12px 18px;
  border-radius:14px;
  background:#9B6A6C;
  color:white;
  text-decoration:none;
  font-weight:600;
}

</style>

</head>

<body>

<div class="top">

  <div class="category">Válasz őrző</div>

  <div class="big" id="rolling">A sors dönt...</div>

</div>

<div class="bottom">

  <div class="answer" id="result"></div>

  <div class="hint" id="hint"></div>

  <a class="btn" href="index.html">Kattkaland</a>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// ======================
// SUPABASE
// ======================
const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

// ======================
// ID RENDSZER (STABIL)
// ======================
const sessionId =
  new URLSearchParams(location.search).get("id")
  || new URLSearchParams(location.search).get("tag")

const tag =
  new URLSearchParams(location.search).get("tag") || "valaszorzo"

console.log("SESSION:", sessionId)
console.log("TAG:", tag)

// HA NINCS ID → STOP
if(!sessionId){
  document.body.innerHTML = "<h2>Hiányzó ID az URL-ben</h2>"
  throw new Error("Missing sessionId")
}

// ======================
// UI
// ======================
const rolling = document.getElementById("rolling")
const result = document.getElementById("result")
const hint = document.getElementById("hint")

// ======================
// PÖRGÉS
// ======================
const words = ["IGEN","NEM","TALÁN"]

// ======================
// 25 VÁLASZ
// ======================
const answers = [
  { type:"yes", text:"Igen." },
  { type:"yes", text:"Minden jel erre mutat." },
  { type:"yes", text:"Egyértelműen igen." },
  { type:"yes", text:"Bátran vágj bele." },
  { type:"yes", text:"Kétség sem fér hozzá." },

  { type:"yes", text:"Ez jó irány." },
  { type:"yes", text:"A csillagok is ezt mutatják." },

  { type:"maybe", text:"Kérdezd újra később." },
  { type:"maybe", text:"Most még nem tiszta." },
  { type:"maybe", text:"A helyzet alakul." },
  { type:"maybe", text:"Nem egyértelmű." },
  { type:"maybe", text:"Várj egy kicsit." },

  { type:"no", text:"Nem." },
  { type:"no", text:"Erősen kétséges." },
  { type:"no", text:"Most ne." },
  { type:"no", text:"Nem ezt az utat válaszd." },
  { type:"no", text:"A válasz negatív." },

  { type:"clue", text:"A válasz a részletekben rejlik." },
  { type:"clue", text:"Nem minden az, aminek látszik." },
  { type:"clue", text:"A döntés már megszületett benned." },
  { type:"clue", text:"A jelek több irányba mutatnak." },

  { type:"yes", text:"Igen, de légy türelmes." },
  { type:"no", text:"Nem most van itt az ideje." },
  { type:"maybe", text:"Még változhat minden." }
]

// ======================
// RANDOM VÁLASZ
// ======================
const randomAnswer =
  answers[Math.floor(Math.random() * answers.length)]

// ======================
// SUPABASE INSERT (FIXED)
// ======================
async function save(){

  console.log("INSERT START")

  const { data, error } = await supabase
    .from("valaszorzo_links")
    .insert({
      session_id: sessionId,
      tag: tag,
      answer: randomAnswer.text,
      answer_type: randomAnswer.type
    })
    .select()

  console.log("INSERT RESULT:", { data, error })

  if(error){
    console.error("SUPABASE HIBA:", error)
    document.body.innerHTML =
      "<h2>Supabase hiba: " + error.message + "</h2>"
    return
  }

  animate(randomAnswer)
}

// ======================
// ANIMÁCIÓ
// ======================
function animate(data){

  let i = 0

  const interval = setInterval(() => {

    rolling.textContent = words[i % words.length]
    i++

    if(i > 14){
      clearInterval(interval)

      rolling.textContent =
        data.type === "clue" ? "REJTÉLY"
        : data.type === "yes" ? "IGEN"
        : data.type === "no" ? "NEM"
        : "TALÁN"

      result.textContent = data.text
      hint.textContent = "Új válaszhoz érintsd újra a bilétát"
    }

  }, 80)
}

// ======================
// START
// ======================
save()

</script>

</body>
</html>
