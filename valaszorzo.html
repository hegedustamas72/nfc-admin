<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz őrző</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 60px;
  font-size: 40px;
}

button {
  margin-top: 40px;
  padding: 14px 28px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: white;
  color: black;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<h1>Válasz őrző</h1>

<button onclick="generate()">Kérdezz</button>

<script>
let data = [];

// 🔗 Google Sheet → Opensheet JSON API
const SHEET_URL =
  "https://opensheet.elk.sh/11R_-GOutX5MaApZoojq6h2_-iMmSq8DpscQO13f2qMw/Munkalap1";

async function loadData() {
  try {
    const res = await fetch(SHEET_URL);
    data = await res.json();
    console.log("Betöltve:", data);
  } catch (err) {
    console.error("Hiba a betöltésnél:", err);
    alert("Nem sikerült betölteni az adatokat.");
  }
}

function generate() {
  if (!data || data.length === 0) {
    alert("Még nem töltődtek be az adatok.");
    return;
  }

  const item = data[Math.floor(Math.random() * data.length)];

  // átadás results oldalnak
  const encoded = encodeURIComponent(JSON.stringify(item));
  window.location.href = "valaszorzoresults.html?data=" + encoded;
}

// betöltés induláskor
loadData();
</script>

</body>
</html>
