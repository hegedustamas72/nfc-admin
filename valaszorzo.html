<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz őrző</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 60px;
  font-size: 40px;
}
</style>
</head>

<body>

<h1>Válasz őrző</h1>

<script>
let data = [];

const SHEET_URL =
  "https://opensheet.elk.sh/11R_-GOutX5MaApZoojq6h2_-iMmSq8DpscQO13f2qMw/Munkalap1";

/* ---------------------------
   🔄 SAFE DATA LOAD
----------------------------*/
async function loadData() {
  try {
    const res = await fetch(SHEET_URL);
    const json = await res.json();

    // 🔥 SZŰRÉS: csak valid sorok
    data = json.filter(x =>
      x &&
      typeof x.answer === "string" &&
      x.answer.trim() !== "" &&
      typeof x.type === "string" &&
      x.type.trim() !== ""
    );

    console.log("Betöltve (szűrt):", data);

    // automatikus indulás
    generate();

  } catch (err) {
    console.error("Hiba:", err);
    alert("Nem sikerült betölteni az adatokat.");
  }
}

/* ---------------------------
   🎲 GENERATE
----------------------------*/
function generate() {
  if (!data.length) {
    alert("Nincs betölthető adat.");
    return;
  }

  const item = data[Math.floor(Math.random() * data.length)];

  // extra védelem
  if (!item.answer || !item.type) {
    console.warn("HIBÁS SOR KIHAGYVA:", item);
    return generate();
  }

  const encoded = encodeURIComponent(JSON.stringify(item));
  window.location.href = "valaszorzoresults.html?data=" + encoded;
}

/* ---------------------------
   START
----------------------------*/
loadData();
</script>

</body>
</html>
