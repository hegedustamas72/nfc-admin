<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const tag =
  new URLSearchParams(location.search).get("tag") || "valaszorzo"

const sessionId = new URLSearchParams(location.search).get("tag")

if(!sessionId){
  throw new Error("Missing tag")
}

const answers = [
  { type:"yes", text:"Igen." },
  { type:"yes", text:"Minden jel erre mutat." },
  { type:"yes", text:"Egyértelműen igen." },
  { type:"yes", text:"Bátran vágj bele." },
  { type:"yes", text:"Kétség sem fér hozzá." },

  { type:"maybe", text:"Kérdezd újra később." },
  { type:"maybe", text:"Most még nem tiszta." },
  { type:"maybe", text:"A helyzet alakul." },

  { type:"no", text:"Nem." },
  { type:"no", text:"Erősen kétséges." },
  { type:"no", text:"Most ne." },

  { type:"clue", text:"A válasz a részletekben rejlik." },
  { type:"clue", text:"Nem minden az, aminek látszik." }
]

// 🔥 NEM ismételhet azonnal
const last = sessionStorage.getItem("last_answer")
let pool = answers.filter(a => a.text !== last)

if (pool.length === 0) pool = answers

const randomAnswer = pool[Math.floor(Math.random() * pool.length)]

sessionStorage.setItem("last_answer", randomAnswer.text)

const { error } = await supabase
  .from("valaszorzo_links")
  .insert({
    session_id: sessionId,
    tag,
    answer: randomAnswer.text,
    answer_type: randomAnswer.type
  })

if (error) {
  console.error(error)
  document.body.innerHTML = "Supabase hiba: " + error.message
  throw error
}

window.location.href =
  "valaszorzoresults.html?id=" + sessionId
</script>
