<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz őrző</title>
</head>
<body>

<h1>Válasz őrző</h1>
<button onclick="generate()">Kérdezz</button>

<script>
let data = [];

async function loadCSV() {
  const res = await fetch("valaszorzo.csv");
  const text = await res.text();

  const rows = text.trim().split("\n").slice(1);

  data = rows.map(r => {
    const [answer, type] = r.split(",");
    return {answer, type};
  });
}

function generate() {
  const item = data[Math.floor(Math.random() * data.length)];

  const encoded = encodeURIComponent(JSON.stringify(item));
  window.location.href = "valaszorzoresults.html?data=" + encoded;
}

loadCSV();
</script>

</body>
</html>
