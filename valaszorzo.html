<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Válasz őrző</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #FFFFFF;
  color: black;
  text-align: center;
}

h1 {
  margin-top: 60px;
  font-size: 40px;
}
</style>
</head>

<body>

<h1 id="status">Betöltés...</h1>

<script>
let data = [];

const SHEET_URL =
  "https://opensheet.elk.sh/11R_-GOutX5MaApZoojq6h2_-iMmSq8DpscQO13f2qMw/Munkalap1";

const statusEl =
  document.getElementById("status");

const validTypes =
  ["yes", "no", "maybe", "clue"];

/* ---------------------------
   SAFE DATA LOAD
----------------------------*/
async function loadData() {

  try {

    const res = await fetch(
      SHEET_URL,
      { cache: "no-store" }
    );

    if (!res.ok) {
      throw new Error(
        "OpenSheet hiba: " + res.status
      );
    }

    const json = await res.json();

    if (!Array.isArray(json)) {
      throw new Error(
        "Hibás adatstruktúra érkezett."
      );
    }

    data = json
      .map(row => ({
        answer:
          String(row.answer || "").trim(),

        type:
          String(row.type || "")
            .trim()
            .toLowerCase()
      }))
      .filter(row =>
        row.answer !== "" &&
        validTypes.includes(row.type)
      );

    console.log(
      "Betöltve (szűrt):",
      data
    );

    if (!data.length) {
      throw new Error(
        "Nincs betölthető válasz."
      );
    }

    generate();

  } catch (err) {

    console.error(
      "Hiba:",
      err
    );

    statusEl.textContent =
      "Nem sikerült betölteni az adatokat.";

  }
}


/* ---------------------------
   RANDOM VÁLASZ
----------------------------*/
function generate() {

  const item =
    data[
      Math.floor(
        Math.random() * data.length
      )
    ];

  if (!item) {
    statusEl.textContent =
      "Nem sikerült választ kiválasztani.";
    return;
  }

  const encoded =
    encodeURIComponent(
      JSON.stringify(item)
    );

  window.location.href =
    "valaszorzoresults.html?data=" +
    encoded;
}


/* ---------------------------
   START
----------------------------*/
loadData();
</script>

</body>
</html>
