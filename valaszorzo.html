<script type="module">

const SHEET_URL =
  "https://opensheet.elk.sh/11R_-GOutX5MaApZoojq6h2_-iMmSq8DpscQO13f2qMw/Munkalap1"

const res = await fetch(SHEET_URL)
const rows = await res.json()

if (!rows?.length) {
  document.body.innerHTML = "Nincs adat 😔"
  throw new Error("No data")
}

// RANDOM VÁLASZ
const random =
  rows[Math.floor(Math.random() * rows.length)]

// UI
const words = ["IGEN","NEM","TALÁN"]

const rolling = document.getElementById("rolling")
const result = document.getElementById("result")
const hint = document.getElementById("hint")

function animate(){

  let i = 0

  const interval = setInterval(() => {

    rolling.textContent = words[i % words.length]
    i++

    if (i > 14) {
      clearInterval(interval)

      rolling.textContent =
        random.type === "yes" ? "IGEN"
        : random.type === "no" ? "NEM"
        : "TALÁN"

      result.textContent = random.answer
      hint.textContent = "Új válasz = új olvasás"
    }

  }, 80)
}

animate()

</script>
