<body>

<div class="card">
  <div class="loading">A sors dönt...</div>
  <div class="small">Kérjük várj</div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
);

const tag = new URLSearchParams(location.search).get("tag") || "unknown";
const sessionId = crypto.randomUUID();

const answers = [
  {type:"yes",text:"Igen."},
  {type:"yes",text:"Minden jel erre mutat."},
  {type:"yes",text:"Egyértelműen igen."},
  {type:"maybe",text:"Kérdezd újra később."},
  {type:"maybe",text:"Nem tiszta még."},
  {type:"no",text:"Nem."},
  {type:"no",text:"Most ne."},
  {type:"clue",text:"A válasz rejtve van."}
];

const pick = answers[Math.floor(Math.random()*answers.length)];

async function run(){
  const { error } = await supabase
    .from("valaszorzo_links")
    .insert({
      tag,
      session_id: sessionId,
      answer: pick.text,
      answer_type: pick.type
    });

  if(error){
    document.body.innerHTML = "<h2>Supabase hiba</h2><pre>"+error.message+"</pre>";
    console.error(error);
    return;
  }

  window.location.href = "valaszorzoresults.html?id=" + sessionId;
}

run();
</script>
