<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magic 8 Ball</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
  box-sizing:border-box;

  background:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
    url('magic8.jpg');

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  color:white;
  font-family:'DM Sans',sans-serif;
}

.card{
  width:min(100%,420px);
  min-height:90vh;

  display:flex;
  flex-direction:column;
}

#content{
  flex:1;
  display:flex;
  flex-direction:column;
}

.bigtext{
  font-size:34px;
  font-weight:700;
  text-align:center;
  letter-spacing:2px;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
  transition:opacity 0.2s ease;
}

.bottom{
  margin-top:auto;
  text-align:center;
}

.answer{
  font-size:36px;
  font-weight:700;
  line-height:1.3;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}

.hint{
  margin-top:18px;
  opacity:.8;
  font-size:14px;
}

.footer{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;

  border-radius:14px;

  background:#3056d3;

  color:white;
  text-decoration:none;

  box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.btn img{
  width:18px;
  height:18px;
}

.click{
  animation: click 0.18s ease;
}

@keyframes click{
  0% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.02); filter: brightness(1.4); }
  100% { transform: scale(1); filter: brightness(1); }
}

.fade-out{ opacity:0; }
.fade-in{ opacity:1; }

</style>

</head>

<body>

<div class="card">

  <div id="content">

    <div class="bigtext" id="rolling">
      A sors dönt...
    </div>

    <div class="bottom" id="bottom"></div>

  </div>

  <div class="footer">

    <a class="btn" href="index.html">

      <!-- 🔥 LOGÓ VISSZATÉR -->
      <img src="brand-icon.png" alt="logo">

      Kattkaland
    </a>

  </div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const sessionId =
  new URLSearchParams(location.search).get("id")

const el = document.getElementById("rolling")
const bottom = document.getElementById("bottom")

let data = null

if(sessionId){

  const { data: res } =
    await supabase
      .from("magic8_links")
      .select("*")
      .eq("session_id", sessionId)
      .maybeSingle()

  data = res || null
}

const words = ["IGEN","NEM","TALÁN","IGEN","NEM","TALÁN"]

let i = 0
let speed = 55

function flash(){
  el.classList.remove("click")
  void el.offsetWidth
  el.classList.add("click")
}

function tick(){

  el.textContent = words[i % words.length]
  i++

  flash()

  speed *= 1.12

  if(speed > 420){
    stop()
    return
  }

  setTimeout(tick, speed)
}

function stop(){

  let final = "TALÁN"

  if(data?.answer_type === "yes") final = "IGEN"
  if(data?.answer_type === "no") final = "NEM"

  el.classList.add("fade-out")

  setTimeout(() => {

    el.textContent = final
    el.classList.remove("fade-out")
    el.classList.add("fade-in")

    bottom.innerHTML = `
      <div class="answer">
        ${data?.answer || ""}
      </div>
      <div class="hint">
        Új válaszért érintsd újra a bilétát
      </div>
    `

  }, 180)
}

tick()

</script>

</body>
</html>
