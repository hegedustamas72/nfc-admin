<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(

)

// ======================
// 🔥 NFC SAFE SESSION CLEAN
// ======================

const params = new URLSearchParams(location.search)

let sessionId = (params.get("id") || "")

// brutál tisztítás NFC hibák ellen
sessionId = decodeURIComponent(sessionId)
  .replace(/[^a-zA-Z0-9-]/g, "")
  .trim()

console.log("SESSION ID CLEAN:", sessionId)

// ======================
// UI
// ======================

const el = document.getElementById("rolling")
const bottom = document.getElementById("bottom")
const categoryEl = document.getElementById("category")

// ======================
// FALLBACK
// ======================

const fallback = {
  answer: "A jelek bizonytalanok, próbáld újra.",
  answer_type: "maybe",
  tag: "Válasz őrző"
}

// ======================
// FORGÁS
// ======================

const words = ["IGEN","NEM","TALÁN"]

let i = 0
let speed = 50
let finalData = fallback

function tick(){
  el.textContent = words[i % words.length]
  i++
  speed *= 1.12
  if(speed > 420) return stop()
  setTimeout(tick, speed)
}

// ======================
// SUPABASE FETCH (DEBUGGED)
// ======================

async function fetchAnswer(){

  if(!sessionId){
    console.warn("NO SESSION ID")
    return fallback
  }

  const { data, error } = await supabase
    .from("magic8_links")
    .select("answer, answer_type, tag, session_id, created_at")
    .eq("session_id", sessionId)
    .order("created_at", { ascending: false })
    .limit(1)

  console.log("SUPABASE RAW RESULT:", data, error)

  if(error){
    console.error("SUPABASE ERROR:", error)
    return fallback
  }

  if(!data || data.length === 0){
    console.warn("NO DATA FOUND → fallback")
    return fallback
  }

  return data[0]
}


  const { data, error } = await supabase
  .from("magic8_links")
  .select("*")

console.log("ALL ROWS:", data)
console.log("ERROR:", error)

  
// ======================
// STOP
// ======================

function stop(){

  const map = {
    yes: "IGEN",
    no: "NEM",
    maybe: "TALÁN",
    clue: "REJTÉLY"
  }

  const final = map[finalData.answer_type] || "REJTÉLY"

  el.textContent = final

  bottom.innerHTML = `
    <div class="answer">${finalData.answer}</div>
    <div class="hint">Új válaszhoz érintsd újra a bilétát</div>
  `
}

// ======================
// START
// ======================

(async () => {

  finalData = await fetchAnswer()

  console.log("FINAL DATA:", finalData)

  categoryEl.textContent = finalData.tag || "Válasz őrző"

  tick()

})()
