<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magic 8 Ball</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
  box-sizing:border-box;

  background:
    linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
    url('magic8.jpg');

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  color:white;
  font-family:'DM Sans',sans-serif;
}

.card{
  width:min(100%,420px);
  min-height:90vh;

  display:flex;
  flex-direction:column;
}

#content{
  flex:1;
  display:flex;
  flex-direction:column;
}

.bigtext{
  font-size:32px;
  font-weight:700;
  min-height:40px;
  text-align:center;
  letter-spacing:2px;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
  transition:all 0.12s ease;
}

.bottom{
  margin-top:auto;
  text-align:center;
}

.answer{
  font-size:38px;
  font-weight:700;
  line-height:1.3;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
}

.hint{
  margin-top:18px;
  opacity:.8;
  font-size:14px;
}

.footer{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;

  border-radius:14px;

  background:#3056d3;

  color:white;
  text-decoration:none;

  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.btn img{
  width:18px;
  height:18px;
}

/* FX */
.flash {
  animation: flash 0.12s ease;
}

@keyframes flash {
  0% { filter: brightness(1); }
  50% { filter: brightness(1.6); }
  100% { filter: brightness(1); }
}

.shake {
  animation: shake 0.25s;
}

@keyframes shake {
  0% { transform: translate(0,0); }
  50% { transform: translate(-2px,1px); }
  100% { transform: translate(2px,-1px); }
}

</style>

</head>

<body>

<div class="card">

  <div id="content">

    <div class="bigtext" id="rolling">A sors dönt...</div>

    <div class="bottom" id="bottom"></div>

  </div>

  <div class="footer">
    <a class="btn" href="index.html">
      <img src="brand-icon.png">
      Kattkaland
    </a>
  </div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const sessionId =
  new URLSearchParams(location.search).get("id")

const el = document.getElementById("rolling")
const bottom = document.getElementById("bottom")

// -------------------------
// STATE
// -------------------------
let audioReady = false
let audioAllowed = false

// -------------------------
// AUDIO ENGINE
// -------------------------
const AudioCtx =
  window.AudioContext || window.webkitAudioContext

const audioCtx = new AudioCtx()

function unlockAudio(){

  audioCtx.resume().then(() => {
    audioReady = true
  })
}

document.addEventListener("touchend", unlockAudio, { once:false })
document.addEventListener("click", unlockAudio)

// “priming pulse” iOS fix
function primeAudio(){

  if(!audioReady) return

  const osc = audioCtx.createOscillator()
  const gain = audioCtx.createGain()

  osc.frequency.value = 1
  gain.gain.value = 0.0001

  osc.connect(gain)
  gain.connect(audioCtx.destination)

  osc.start()
  osc.stop(audioCtx.currentTime + 0.01)

  audioAllowed = true
}

document.addEventListener("touchend", primeAudio, { once:true })

// -------------------------
// CLICK SOUND (robust)
// -------------------------
function clickSound(){

  if(!audioReady || !audioAllowed) return

  const osc = audioCtx.createOscillator()
  const gain = audioCtx.createGain()

  osc.type = "square"
  osc.frequency.value = 1000 + Math.random()*200

  gain.gain.setValueAtTime(0.06, audioCtx.currentTime)
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04)

  osc.connect(gain)
  gain.connect(audioCtx.destination)

  osc.start()
  osc.stop(audioCtx.currentTime + 0.05)
}

// -------------------------
// VISUAL + FALLBACK FX
// -------------------------
function fx(){

  if(navigator.vibrate){
    navigator.vibrate(8)
  }

  el.classList.remove("flash","shake")
  void el.offsetWidth
  el.classList.add("flash","shake")
}

// -------------------------
// SPIN
// -------------------------
const words = ["IGEN","NEM","TALÁN","IGEN","NEM","TALÁN"]

let i = 0
let speed = 45

function tick(){

  el.textContent = words[i % words.length]
  i++

  clickSound()
  fx()

  speed *= 1.13

  if(speed > 420){
    stop()
    return
  }

  setTimeout(tick, speed)
}

// -------------------------
// STOP
// -------------------------
function stop(){

  if(navigator.vibrate){
    navigator.vibrate([60,40,140])
  }

  let category = "TALÁN"

  if(data?.answer_type === "yes") category = "IGEN"
  if(data?.answer_type === "no") category = "NEM"

  el.style.opacity = 0

  setTimeout(() => {
    el.style.opacity = 1
    el.textContent = category

    bottom.innerHTML = `
      <div class="answer">
        ${data?.answer || "—"}
      </div>
      <div class="hint">
        Új válaszért érintsd újra a bilétát.
      </div>
    `
  }, 150)
}

// -------------------------
// LOAD DATA (optional Supabase)
// -------------------------
let data = null

if(sessionId){

  const res = await supabase
    .from("magic8_links")
    .select("*")
    .eq("session_id", sessionId)
    .maybeSingle()

  data = res.data || null
}

// START
tick()

</script>

</body>
</html>
