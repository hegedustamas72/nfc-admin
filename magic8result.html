<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic 8 Ball</title>

<style>

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:url('magic8.jpeg') center/cover;
  color:white;
  font-family:Arial;
}

.bigtext{
  font-size:40px;
  font-weight:700;
  text-align:center;
}

.bottom{
  margin-top:20px;
  text-align:center;
}

.answer{
  font-size:26px;
  font-weight:700;
}

.fade-out{ opacity:0; transition:0.2s; }
.fade-in{ opacity:1; transition:0.2s; }

</style>
</head>

<body>

<div>
  <div class="bigtext" id="rolling">A sors dönt...</div>
  <div class="bottom" id="bottom"></div>
</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const sessionId = new URLSearchParams(location.search).get("id")

const el = document.getElementById("rolling")
const bottom = document.getElementById("bottom")

if (!sessionId) {
  bottom.innerHTML = "Hiányzó session 😔"
  throw new Error("No session")
}

// ======================
// FONTOS FIX: limit + select védelem
// ======================

const { data, error } =
  await supabase
    .from("magic8_links")
    .select("answer, answer_type")
    .eq("session_id", sessionId)
    .limit(1)
    .maybeSingle()

if (error) {
  bottom.innerHTML = "Supabase hiba 😔"
  throw error
}

if (!data) {
  bottom.innerHTML = "Nincs adat 😔"
  throw new Error("No data")
}

// ======================
// FORGÁS
// ======================

const words = ["IGEN","NEM","TALÁN"]

let i = 0
let speed = 60

function tick(){

  el.textContent = words[i % words.length]
  i++

  speed *= 1.10

  if (speed > 450) {
    stop()
    return
  }

  setTimeout(tick, speed)
}

// ======================
// STOP
// ======================

function stop(){

  const map = {
    yes: "IGEN",
    no: "NEM",
    maybe: "TALÁN",
    clue: "REJTÉLY"
  }

  const final = map[data.answer_type] || "REJTÉLY"

  el.classList.add("fade-out")

  setTimeout(() => {

    el.textContent = final
    el.classList.remove("fade-out")
    el.classList.add("fade-in")

    bottom.innerHTML = `
      <div class="answer">${data.answer}</div>
      <div>Új válaszért érintsd újra</div>
    `

  }, 200)
}

tick()

</script>

</body>
</html>
