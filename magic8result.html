<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic 8 Ball</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:url('magic8.jpeg') center/cover;
  color:white;
  font-family:Arial;
}

.bigtext{
  font-size:42px;
  font-weight:700;
  text-align:center;
}

.bottom{
  margin-top:20px;
  text-align:center;
}

.answer{
  font-size:26px;
  font-weight:700;
}
</style>

</head>

<body>

<div>
  <div class="bigtext" id="rolling">A sors dönt...</div>
  <div class="bottom" id="bottom"></div>
</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const el = document.getElementById("rolling")
const bottom = document.getElementById("bottom")

// ======================
// SAFE SESSION ID
// ======================

const params = new URLSearchParams(location.search)
const sessionId = (params.get("id") || "").trim()

console.log("SESSION:", sessionId)

// ======================
// FORGÁS INDÍTÁS MINDIG
// ======================

const words = ["IGEN","NEM","TALÁN"]

let i = 0
let speed = 55

function tick(){

  el.textContent = words[i % words.length]
  i++

  speed *= 1.11

  if (speed > 420) {
    stop()
    return
  }

  setTimeout(tick, speed)
}

// ======================
// FALLBACK VÁLASZOK
// ======================

const fallback = {
  answer: "A jelek bizonytalanok, próbáld újra.",
  answer_type: "clue"
}

// ======================
// SUPABASE LEKÉRÉS (SAFE)
// ======================

async function loadData(){

  if (!sessionId) return fallback

  try {

    const { data, error } =
      await supabase
        .from("magic8_links")
        .select("answer, answer_type")
        .eq("session_id", sessionId)
        .limit(1)
        .maybeSingle()

    if (error) {
      console.warn("Supabase error:", error)
      return fallback
    }

    if (!data) {
      console.warn("No data found")
      return fallback
    }

    return data

  } catch (e) {
    console.warn("Exception:", e)
    return fallback
  }
}

// ======================
// STOP
// ======================

let finalData = fallback

function stop(){

  const map = {
    yes: "IGEN",
    no: "NEM",
    maybe: "TALÁN",
    clue: "REJTÉLY"
  }

  const final = map[finalData.answer_type] || "REJTÉLY"

  el.textContent = final

  bottom.innerHTML = `
    <div class="answer">
      ${finalData.answer}
    </div>
  `
}

// ======================
// START FLOW
// ======================

(async () => {

  finalData = await loadData()

  tick()

})()

</script>

</body>
</html>
