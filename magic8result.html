<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic 8 Ball</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  box-sizing:border-box;

  background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
    url('magic8.jpeg');

  background-size:cover;
  background-position:center;

  color:white;
  font-family:'DM Sans',sans-serif;
}

/* KÁRTYA – AHOGY EDDIG IS VOLT */
.card{
  width:min(420px,100%);
  min-height:90vh;
  display:flex;
  flex-direction:column;
}

/* FELSŐ RÉSZ (FORGÁS) */
.top{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* FORGÓ SZÖVEG */
.bigtext{
  font-size:42px;
  font-weight:700;
  text-align:center;
  letter-spacing:2px;
  text-shadow:0 2px 10px rgba(0,0,0,0.7);
}

/* ALSÓ RÉSZ (VÁLASZ) */
.bottom{
  text-align:center;
  padding-bottom:40px;
}

.answer{
  font-size:28px;
  font-weight:700;
  line-height:1.4;
  text-shadow:0 2px 10px rgba(0,0,0,0.7);
}

.hint{
  margin-top:12px;
  font-size:13px;
  opacity:0.75;
}

.fade-out{ opacity:0; transition:0.2s; }
.fade-in{ opacity:1; transition:0.2s; }

</style>
</head>

<body>

<div class="card">

  <!-- FORGÁS FELÜL -->
  <div class="top">
    <div class="bigtext" id="rolling">A sors dönt...</div>
  </div>

  <!-- VÁLASZ ALUL -->
  <div class="bottom" id="bottom"></div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const el = document.getElementById("rolling")
const bottom = document.getElementById("bottom")

const params = new URLSearchParams(location.search)
const sessionId = (params.get("id") || "").trim()

// fallback
const fallback = {
  answer: "A jelek bizonytalanok, próbáld újra.",
  answer_type: "clue"
}

const words = ["IGEN","NEM","TALÁN"]

let i = 0
let speed = 55
let finalData = fallback

function tick(){

  el.textContent = words[i % words.length]
  i++

  speed *= 1.12

  if (speed > 420) {
    stop()
    return
  }

  setTimeout(tick, speed)
}

async function loadData(){

  try {

    const { data, error } =
      await supabase
        .from("magic8_links")
        .select("answer, answer_type")
        .eq("session_id", sessionId)
        .limit(1)
        .maybeSingle()

    if (!data || error) return fallback

    return data

  } catch {
    return fallback
  }
}

function stop(){

  const map = {
    yes: "IGEN",
    no: "NEM",
    maybe: "TALÁN",
    clue: "REJTÉLY"
  }

  const final = map[finalData.answer_type] || "REJTÉLY"

  el.classList.add("fade-out")

  setTimeout(() => {

    el.textContent = final
    el.classList.remove("fade-out")
    el.classList.add("fade-in")

    bottom.innerHTML = `
      <div class="answer">${finalData.answer}</div>
      <div class="hint">Új válaszhoz érintsd újra a bilétát</div>
    `

  }, 200)
}

(async () => {
  finalData = await loadData()
  tick()
})()

</script>

</body>
</html>
