<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magic 8 Ball</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
  box-sizing:border-box;

  background:
    linear-gradient(
      rgba(0,0,0,0.25),
      rgba(0,0,0,0.25)
    ),
    url('magic8.jpg');

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  color:white;
  font-family:'DM Sans',sans-serif;
}

.card{
  width:min(100%,420px);
  min-height:90vh;

  display:flex;
  flex-direction:column;
}

#content{
  flex:1;
  display:flex;
  flex-direction:column;
}

.category{
  font-size:20px;
  font-weight:700;
  letter-spacing:5px;
  opacity:.9;
  margin-bottom:10px;
  text-align:center;
}

.bottom{
  margin-top:auto;
  text-align:center;
}

.answer{
  font-size:38px;
  font-weight:700;
  line-height:1.3;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
}

.hint{
  margin-top:18px;
  opacity:.8;
  font-size:14px;
}

.footer{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.creator{
  font-size:12px;
  opacity:.75;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;

  border-radius:14px;

  background:#9B6A6C;

  color:white;
  text-decoration:none;

  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.btn img{
  width:18px;
  height:18px;
}

.error{
  color:#ffb0b0;
  font-weight:700;
}

.rolling{
  font-size:32px;
  font-weight:700;
  min-height:40px;
  text-align:center;
  margin-top:20px;
}

</style>

</head>

<body>

<div class="card">

  <div id="content">

    <div class="category" id="category"></div>

    <div class="rolling" id="rolling">
      A sors dönt...
    </div>

    <div class="bottom" id="bottom"></div>

  </div>

  <div class="footer">

    <div class="creator">
      Megrendelhető:
    </div>

    <a class="btn" href="index.html">
      <img src="brand-icon.png">
      Kattkaland
    </a>

  </div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const sessionId =
  new URLSearchParams(window.location.search)
  .get("id")

const categoryEl =
  document.getElementById("category")

const rollingEl =
  document.getElementById("rolling")

const bottomEl =
  document.getElementById("bottom")

if(!sessionId){

  rollingEl.innerHTML =
    '<div class="error">Hiányzó ID 😔</div>'

  throw new Error("No ID")
}

const { data, error } =
  await supabase
    .from("magic8_links")
    .select("*")
    .eq("session_id", sessionId)
    .maybeSingle()

if(error || !data){

  rollingEl.innerHTML =
    '<div class="error">Nem található 😔</div>'

  throw error
}

// kategória
let category = "TALÁN"

if(data.answer_type === "yes") category = "IGEN"
if(data.answer_type === "no") category = "NEM"

categoryEl.textContent = category

// animáció
const rollingWords = ["IGEN","NEM","TALÁN","IGEN","NEM","TALÁN"]

let i = 0

const timer = setInterval(() => {

  rollingEl.textContent =
    rollingWords[i % rollingWords.length]

  i++

}, 100)

setTimeout(() => {

  clearInterval(timer)

  rollingEl.style.display = "none"

  bottomEl.innerHTML = `
    <div class="answer">
      ${data.answer}
    </div>

    <div class="hint">
      Új válaszért érintsd újra a bilétát.
    </div>
  `

}, 2000)

</script>

</body>
</html>
