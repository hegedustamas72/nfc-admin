<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magic 8 Ball</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  min-height:100vh;

  display:flex;
  justify-content:center;

  padding:20px;
  box-sizing:border-box;

  background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
    url('magic8.jpeg');

  background-size:cover;
  background-position:center;

  color:white;
  font-family:'DM Sans',sans-serif;
}

.card{
  width:min(420px,100%);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.top{
  margin-top:10px;
  text-align:center;
}

.category{
  font-size:14px;
  opacity:0.8;
  margin-bottom:8px;
}

.bigtext{
  font-size:42px;
  font-weight:700;
  letter-spacing:2px;
}

.bottom{
  margin-top:auto;
  text-align:center;
  padding-bottom:30px;
}

.answer{
  font-size:28px;
  font-weight:700;
}

.hint{
  font-size:13px;
  opacity:0.7;
  margin-top:10px;
}

.footer{
  margin-top:20px;
  text-align:center;
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:12px 18px;
  border-radius:14px;
  background:#9B6A6C;
  color:white;
  text-decoration:none;
  font-weight:600;
}

</style>
</head>

<body>

<div class="card">

  <div class="top">
    <div class="category" id="category">Magic 8 Ball</div>
    <div class="bigtext" id="rolling">A sors dönt...</div>
  </div>

  <div class="bottom" id="bottom"></div>

  <div class="footer">
    <a class="btn" href="index.html">
      <img src="brand-icon.png" width="18">
      Kattkaland
    </a>
  </div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

// ======================
// SESSION (SAFE)
// ======================

const params = new URLSearchParams(location.search)

const sessionId = (params.get("id") || "")
  .replace(/\s/g, "")
  .trim()

  .eq("session_id", sessionId.replace(/\s/g, ""))
)

// ======================
// UI ELEMENTS
// ======================

const el = document.getElementById("rolling")
const bottom = document.getElementById("bottom")
const categoryEl = document.getElementById("category")

// ======================
// FALLBACK
// ======================

const fallback = {
  answer: "A jelek bizonytalanok, próbáld újra.",
  answer_type: "clue",
  tag: "Magic 8 Ball"
}

// ======================
// FORGÁS
// ======================

const words = ["IGEN","NEM","TALÁN"]

let i = 0
let speed = 50
let finalData = fallback

function tick(){
  el.textContent = words[i % words.length]
  i++
  speed *= 1.12
  if(speed > 420) return stop()
  setTimeout(tick, speed)
}


  console.log("URL sessionId:", sessionId)
const test = await supabase
  .from("magic8_links")
  .select("session_id, answer")
  .limit(5)

console.log("DB SAMPLE:", test)
  

// ======================
// RETRY LOGIKA
// ======================

async function fetchWithRetry(retries = 2){

  for(let attempt = 0; attempt <= retries; attempt++){

    try{

      const { data, error } =
        await supabase
          .from("magic8_links")
          .select("answer, answer_type, tag")
          .eq("session_id", sessionId)
          .maybeSingle()

      if(data) return data

      if(error) console.warn("Supabase error:", error)

    }catch(e){
      console.warn("Exception:", e)
    }

  }

  return fallback
}

// ======================
// STOP
// ======================

function stop(){

  const map = {
    yes: "IGEN",
    no: "NEM",
    maybe: "TALÁN",
    clue: "REJTÉLY"
  }

  const final = map[finalData.answer_type] || "REJTÉLY"

  el.textContent = final

  bottom.innerHTML = `
    <div class="answer">${finalData.answer}</div>
    <div class="hint">Új válaszhoz érintsd újra a bilétát</div>
  `
}

// ======================
// START
// ======================

(async () => {

  if(!sessionId){
    finalData = fallback
    tick()
    return
  }

  finalData = await fetchWithRetry()

  categoryEl.textContent = finalData.tag || "Magic 8 Ball"

  tick()

})()

</script>

</body>
</html>
