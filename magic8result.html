<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magic 8 Ball</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
  box-sizing:border-box;

  background:
    linear-gradient(
      rgba(0,0,0,0.25),
      rgba(0,0,0,0.25)
    ),
    url('magic8.jpg');

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  color:white;
  font-family:'DM Sans',sans-serif;
}

/* LAYOUT */
.card{
  width:min(100%,420px);
  min-height:90vh;

  display:flex;
  flex-direction:column;
}

#content{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TEXT STYLES */
.bigtext{
  font-size:32px;
  font-weight:700;
  min-height:40px;
  text-align:center;
  letter-spacing:2px;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
}

.category{
  font-size:32px;
  font-weight:700;
  min-height:40px;
  text-align:center;
  letter-spacing:2px;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
}

.bottom{
  margin-top:auto;
  text-align:center;
}

.answer{
  font-size:38px;
  font-weight:700;
  line-height:1.3;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
}

.hint{
  margin-top:18px;
  opacity:.8;
  font-size:14px;
}

/* FOOTER */
.footer{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.creator{
  font-size:12px;
  opacity:.75;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:12px 18px;

  border-radius:14px;

  background:#3056d3;

  color:white;
  text-decoration:none;

  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.btn img{
  width:18px;
  height:18px;
}

.error{
  color:#ffb0b0;
  font-weight:700;
}

/* iOS VISUAL HAPTIC */
.shake {
  animation: shake 0.35s;
}

@keyframes shake {
  0% { transform: translate(0,0); }
  25% { transform: translate(-2px,1px); }
  50% { transform: translate(2px,-1px); }
  75% { transform: translate(-1px,1px); }
  100% { transform: translate(0,0); }
}

.pulse {
  animation: pulse 0.25s ease;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

/* “VARÁZS” FLASH */
.flash {
  animation: flash 0.2s ease;
}

@keyframes flash {
  0% { filter: brightness(1); }
  50% { filter: brightness(1.4); }
  100% { filter: brightness(1); }
}

</style>

</head>

<body>

<div class="card">

  <div id="content">

    <div class="category" id="category"></div>

    <div class="bigtext" id="rolling">
      A sors dönt...
    </div>

    <div class="bottom" id="bottom"></div>

  </div>

  <div class="footer">

    <div class="creator">
      Megrendelhető:
    </div>

    <a class="btn" href="index.html">
      <img src="brand-icon.png">
      Kattkaland
    </a>

  </div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

const sessionId =
  new URLSearchParams(window.location.search)
  .get("id")

const categoryEl =
  document.getElementById("category")

const rollingEl =
  document.getElementById("rolling")

const bottomEl =
  document.getElementById("bottom")

function haptic(){

  // Android vibrate
  if(navigator.vibrate){
    navigator.vibrate(12)
  }

  // iOS visual fallback
  rollingEl.classList.remove("shake","pulse")
  void rollingEl.offsetWidth
  rollingEl.classList.add("shake","pulse")
}

function flash(){
  rollingEl.classList.remove("flash")
  void rollingEl.offsetWidth
  rollingEl.classList.add("flash")
}

if(!sessionId){

  rollingEl.innerHTML =
    '<div class="error">Hiányzó ID 😔</div>'

  throw new Error("No ID")
}

const { data, error } =
  await supabase
    .from("magic8_links")
    .select("*")
    .eq("session_id", sessionId)
    .maybeSingle()

if(error || !data){

  rollingEl.innerHTML =
    '<div class="error">Nem található 😔</div>'

  throw error
}

// -------------------------
// LASSULÓ “SZERKEZET”
// -------------------------

const words = ["IGEN","NEM","TALÁN","IGEN","NEM","TALÁN"]

let i = 0
let delay = 50

function tick(){

  rollingEl.textContent =
    words[i % words.length]

  i++

  haptic()

  delay += 18

  // “varázs pillanat” a vég előtt
  if(delay > 260){
    flash()
  }

  if(delay > 420){
    stop()
    return
  }

  setTimeout(tick, delay)
}

function stop(){

  // végső erős feedback
  if(navigator.vibrate){
    navigator.vibrate([60,40,140])
  }

  let category = "TALÁN"

  if(data.answer_type === "yes") category = "IGEN"
  if(data.answer_type === "no") category = "NEM"

  rollingEl.style.display = "none"

  categoryEl.textContent = category

  bottomEl.innerHTML = `
    <div class="answer">
      ${data.answer}
    </div>

    <div class="hint">
      Új válaszért érintsd újra a bilétát.
    </div>
  `
}

tick()

</script>

</body>
</html>
