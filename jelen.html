<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

let deviceId =
  localStorage.getItem("device_id")

if (!deviceId) {
  deviceId = crypto.randomUUID()

  localStorage.setItem(
    "device_id",
    deviceId
  )
}

// ======================
// SUPABASE
// ======================

const supabase = createClient(
  "https://eogrnzuarpqlyjclkcqq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvZ3JuenVhcnBxbHlqY2xrY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzQyOTYsImV4cCI6MjA4OTUxMDI5Nn0.VA2nMHVZJRHFntfCrsoxNOLJYvDp_a5-zIR4qdWUp8U"
)

// ======================
// TAG
// ======================

const tag =
  new URLSearchParams(window.location.search)
  .get("tag")

if (!tag) {
  document.body.innerHTML =
    "Hiányzó tag 😔"

  throw new Error("No tag")
}

// ======================
// MAI NAP
// ======================

const now = new Date()

const today =
  now.getFullYear() + "-" +
  String(now.getMonth() + 1).padStart(2, "0") + "-" +
  String(now.getDate()).padStart(2, "0")

// ======================
// RÉGI SESSIONÖK TÖRLÉSE
// ======================

await supabase
  .from("daily_links")
  .delete()
  .eq("tag", tag)
  .eq("device_id", deviceId)
  .neq("expires_at", today)

// ======================
// VAN-E MAI SESSION?
// ======================

const { data: existingRows, error: selectError } =
  await supabase
    .from("daily_links")
    .select("*")
    .eq("tag", tag)
    .eq("device_id", deviceId)
    .eq("expires_at", today)

if (selectError) {
  console.error(selectError)

  document.body.innerHTML =
    "Supabase SELECT hiba 😔"

  throw selectError
}

// ======================
// HA VAN, VISSZAADJUK
// ======================

if (existingRows?.length) {
  window.location.href =
    "jelendaily.html?id=" + existingRows[0].session_id

  throw new Error("Existing session")
}

// ======================
// GOOGLE SHEETS
// ======================

// IDE KELL MAJD A DRIVE-RA FELTÖLTÖTT,
// PUBLIKÁLT GOOGLE SHEET AZONOSÍTÓJA.
//
// A munkalap neve a végleges táblázatban legyen:
// 365 nap
//
// Példa:
// https://opensheet.elk.sh/GOOGLE_SHEET_ID/365%20nap

const SHEET_URL =
  "https://opensheet.elk.sh/GOOGLE_SHEET_ID/365%20nap"

const response =
  await fetch(SHEET_URL)

if (!response.ok) {
  document.body.innerHTML =
    "A Google Sheets nem érhető el 😔"

  throw new Error("Sheet fetch failed")
}

const rows =
  await response.json()

if (!rows?.length) {
  document.body.innerHTML =
    "Nincsenek napi kihívások 😔"

  throw new Error("No rows")
}

// ======================
// RANDOM SOR
// ======================

const usableRows =
  rows.filter(row =>
    row["Napi kihívás"] &&
    row["Napi kihívás"].trim()
  )

if (!usableRows.length) {
  document.body.innerHTML =
    "Nincsenek használható napi kihívások 😔"

  throw new Error("No usable rows")
}

const random =
  usableRows[Math.floor(Math.random() * usableRows.length)]

// ======================
// SESSION ID
// ======================

const sessionId =
  crypto.randomUUID()

// ======================
// INSERT
// ======================

const { error: insertError } =
  await supabase
    .from("daily_links")
    .insert({
      tag: tag,
      date_key: today,
      session_id: sessionId,
      quote: random["Napi kihívás"] || "",
      speaker: "",
      device_id: deviceId,
      category: random["Téma"] || "",
      expires_at: today
    })

if (insertError) {
  console.error(insertError)

  document.body.innerHTML = `
    <pre style="
      white-space:pre-wrap;
      padding:16px;
      font-size:12px;
    ">
${JSON.stringify(insertError, null, 2)}
    </pre>
  `

  throw insertError
}

// ======================
// REDIRECT
// ======================

window.location.href =
  "jelendaily.html?id=" + sessionId

</script>

</body>
</html>
