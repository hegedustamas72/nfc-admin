<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lélekvirágzás</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      padding: 24px;

      font-family: Arial, sans-serif;
      color: #2f2b28;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.08)
        ),
        url("lelekviragzas-bg.jpg");

      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .page {
      width: 100%;
      min-height: calc(100vh - 48px);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 560px;

      padding: 32px 24px;

      background: rgba(255, 255, 255, 0.62);

      border-radius: 24px;

      box-shadow:
        0 14px 40px
        rgba(0, 0, 0, 0.10);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      text-align: center;
    }

    .eyebrow {
      margin-bottom: 8px;

      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.16em;

      color: #8c7f73;
    }

    h1 {
      margin: 0 0 8px;

      font-family: "Alex Brush", cursive;
      font-size: 48px;
      font-weight: 400;
      line-height: 1.05;

      color: #4b3a33;
    }

    .subtitle {
      margin: 0 0 28px;

      color: #746b64;
      line-height: 1.5;
    }

    .message-number {
      display: inline-block;

      margin-bottom: 14px;
      padding: 8px 14px;

      border-radius: 999px;

      background: rgba(241, 236, 230, 0.88);

      font-size: 14px;
      font-weight: 700;
    }

    .message-title {
      margin: 0 0 24px;

      font-size: 22px;
      line-height: 1.35;
    }

    audio {
      width: 100%;
      margin-top: 8px;
    }

    .status {
      margin-top: 18px;

      font-size: 14px;
      line-height: 1.45;

      color: #847970;
    }

    .history-button {
      width: 100%;

      margin-top: 26px;
      padding: 14px 18px;

      border: 0;
      border-radius: 16px;

      background: rgba(241, 236, 230, 0.90);

      color: #2f2b28;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
    }

    .history-button:active {
      transform: scale(0.99);
    }

    .history-section {
      margin-top: 18px;
      text-align: left;
    }

    .history-item {
      padding: 18px 0;

      border-top:
        1px solid
        rgba(220, 210, 200, 0.75);
    }

    .history-item:first-child {
      border-top: 0;
    }

    .history-number {
      margin-bottom: 6px;

      font-size: 13px;
      font-weight: 700;

      color: #8c7f73;
    }

    .history-title {
      margin-bottom: 12px;

      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
    }

    .history-item audio {
      margin: 0;
    }

    .history-empty,
    .history-loading {
      padding: 16px 0 4px;

      text-align: center;

      color: #847970;
      font-size: 14px;
    }

    .error {
      padding: 14px 16px;

      border-radius: 14px;

      background: rgba(251, 234, 234, 0.92);

      color: #8f2f2f;

      line-height: 1.45;
    }

    .loading {
      font-size: 16px;
      color: #746b64;
    }

    .hidden {
      display: none;
    }


    /* =========================
       KATTKALAND GOMB
       ========================= */

    .kattkaland-wrap {
      display: flex;
      justify-content: center;

      margin-top: 28px;
    }

    .kattkaland-btn {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      min-width: 220px;

      padding: 12px 18px;

      border-radius: 14px;

      background: #9B6A6C;
      color: white;

      text-decoration: none;

      font-family: "Alex Brush", cursive;
      font-size: 28px;
      font-weight: 600;

      box-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.12);
    }

    .kattkaland-btn img {
      width: 32px;
      height: 32px;

      object-fit: contain;
    }


    /* =========================
       MOBIL
       ========================= */

    @media (max-width: 600px) {

      body {
        padding: 16px;
        background-attachment: scroll;
      }

      .page {
        min-height: calc(100vh - 32px);
      }

      .card {
        padding: 28px 18px;
        border-radius: 24px;
      }

      h1 {
        font-size: 46px;
      }

      .message-title {
        font-size: 21px;
      }

      .kattkaland-btn {
        min-width: 210px;
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <main class="card">

      <div class="eyebrow">
        Napi hangüzenet
      </div>

      <h1>
        Lélekvirágzás
      </h1>

      <p class="subtitle">
        Egy pillanat csak neked.
      </p>


      <div
        id="loading"
        class="loading"
      >
        A mai üzeneted betöltése…
      </div>


      <div
        id="content"
        class="hidden"
      >

        <div
          id="messageNumber"
          class="message-number"
        ></div>

        <h2
          id="messageTitle"
          class="message-title"
        ></h2>

        <audio
          id="audioPlayer"
          controls
          preload="metadata"
        ></audio>

        <div
          id="status"
          class="status"
        ></div>


        <button
          id="historyButton"
          class="history-button"
          type="button"
        >
          Korábbi hangüzeneteim
        </button>


        <div
          id="historySection"
          class="history-section hidden"
        >

          <div
            id="historyLoading"
            class="history-loading hidden"
          >
            Korábbi hangüzenetek betöltése…
          </div>

          <div id="historyList"></div>

        </div>


        <div class="kattkaland-wrap">

          <a
            class="kattkaland-btn"
            href="https://kattkaland.hu/"
            target="_blank"
            rel="noopener noreferrer"
          >

            <img
              src="brand-icon.png"
              alt=""
            >

            Kattkaland

          </a>

        </div>

      </div>


      <div
        id="errorBox"
        class="error hidden"
      ></div>

    </main>

  </div>


  <script>

    const EDGE_FUNCTION_URL =
      "https://eogrnzuarpqlyjclkcqq.supabase.co/functions/v1/audio-message";


    let currentTag = null;
    let currentSequenceNo = null;
    let historyLoaded = false;


    async function callAudioFunction(payload) {

      const response =
        await fetch(
          EDGE_FUNCTION_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(payload)
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Nem sikerült lekérni az adatokat."
        );

      }


      return data;
    }



    async function loadAudioMessage() {

      const loading =
        document.getElementById(
          "loading"
        );

      const content =
        document.getElementById(
          "content"
        );

      const errorBox =
        document.getElementById(
          "errorBox"
        );

      const messageNumber =
        document.getElementById(
          "messageNumber"
        );

      const messageTitle =
        document.getElementById(
          "messageTitle"
        );

      const audioPlayer =
        document.getElementById(
          "audioPlayer"
        );

      const status =
        document.getElementById(
          "status"
        );


      const params =
        new URLSearchParams(
          window.location.search
        );


      const tag =
        params.get("tag");


      if (!tag) {

        loading.classList.add(
          "hidden"
        );

        errorBox.textContent =
          "Hiányzik a biléta azonosítója az URL-ből.";

        errorBox.classList.remove(
          "hidden"
        );

        return;
      }


      currentTag = tag;


      try {

        const data =
          await callAudioFunction({
            tag: tag
          });


        currentSequenceNo =
          data.sequence_no;


        messageNumber.textContent =
          data.sequence_no +
          ". hangüzenet";


        /*
          A SUPABASE audio_messages
          title mezője jelenik meg itt.
        */

        messageTitle.textContent =
          data.title ||
          "A mai üzeneted";


        audioPlayer.src =
          data.audio_url;


        status.textContent =
          data.is_new
            ? "Ma egy új hangüzenet nyílt meg számodra."
            : "Ezt a mai hangüzenetedet már megnyitottad.";


        loading.classList.add(
          "hidden"
        );

        content.classList.remove(
          "hidden"
        );


      } catch (error) {

        console.error(error);


        loading.classList.add(
          "hidden"
        );


        errorBox.textContent =
          error.message ||
          "Hiba történt a hangüzenet betöltése közben.";


        errorBox.classList.remove(
          "hidden"
        );
      }
    }



    async function loadHistory() {

      if (historyLoaded) {
        return;
      }


      const historyLoading =
        document.getElementById(
          "historyLoading"
        );


      const historyList =
        document.getElementById(
          "historyList"
        );


      historyLoading.classList.remove(
        "hidden"
      );


      try {

        const data =
          await callAudioFunction({
            tag: currentTag,
            action: "history"
          });


        historyList.innerHTML = "";


        const previousMessages =
          (data.messages || [])
          .filter(
            message =>
              message.sequence_no !==
              currentSequenceNo
          );


        if (
          previousMessages.length === 0
        ) {

          historyList.innerHTML =
            '<div class="history-empty">' +
            'Még nincs korábbi hangüzeneted.' +
            '</div>';


          historyLoaded = true;

          return;
        }


        previousMessages.forEach(
          message => {

            const item =
              document.createElement(
                "div"
              );


            item.className =
              "history-item";


            const number =
              document.createElement(
                "div"
              );


            number.className =
              "history-number";


            number.textContent =
              message.sequence_no +
              ". hangüzenet";


            const title =
              document.createElement(
                "div"
              );


            title.className =
              "history-title";


            title.textContent =
              message.title ||
              "Hangüzenet";


            const audio =
              document.createElement(
                "audio"
              );


            audio.controls = true;
            audio.preload = "metadata";
            audio.src =
              message.audio_url;


            item.appendChild(
              number
            );

            item.appendChild(
              title
            );

            item.appendChild(
              audio
            );


            historyList.appendChild(
              item
            );

          }
        );


        historyLoaded = true;


      } catch (error) {

        console.error(error);


        historyList.innerHTML =
          '<div class="error">' +
          (
            error.message ||
            "Nem sikerült betölteni a korábbi hangüzeneteket."
          ) +
          '</div>';


      } finally {

        historyLoading.classList.add(
          "hidden"
        );

      }
    }



    document
      .getElementById(
        "historyButton"
      )
      .addEventListener(
        "click",
        async () => {

          const section =
            document.getElementById(
              "historySection"
            );


          const button =
            document.getElementById(
              "historyButton"
            );


          const isHidden =
            section.classList.contains(
              "hidden"
            );


          if (isHidden) {

            section.classList.remove(
              "hidden"
            );


            button.textContent =
              "Korábbi hangüzeneteim elrejtése";


            await loadHistory();


          } else {

            section.classList.add(
              "hidden"
            );


            button.textContent =
              "Korábbi hangüzeneteim";

          }

        }
      );


    loadAudioMessage();

  </script>

</body>
</html>
