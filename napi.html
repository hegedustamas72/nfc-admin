<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Napi Pozitív Üzenet</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&family=Alex+Brush&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'DM Sans',sans-serif;

  background:
    linear-gradient(rgba(255,255,255,0.92),rgba(255,255,255,0.92)),
    url('wood-texture.png');

  background-size:cover;
  background-position:center;

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#424b54;
}

.card{

  background:white;

  border-radius:24px;

  padding:32px 28px;

  width:90%;
  max-width:360px;

  text-align:center;

  box-shadow:0 10px 25px rgba(0,0,0,0.08);

  animation:fadeIn .8s ease;
}

/* =========================
CÍM
========================= */

.title{
  font-family:'Alex Brush',cursive;
  font-size:42px;
  margin-bottom:6px;
}

/* =========================
KATEGÓRIA / SZÖVEG
========================= */

.tag{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  opacity:.6;
  margin-bottom:18px;
}

.message{
  font-size:24px;
  line-height:1.5;
  font-weight:700;
  margin-bottom:12px;
}

.author{
  text-align:right;
  font-size:14px;
  opacity:.7;
  font-style:italic;
  margin-bottom:22px;
  padding-right:12px;
  box-sizing:border-box;
}

/* =========================
GOMB (BRAND)
========================= */

.btn-link{
  text-decoration:none;
}

.btn{
  border:1px solid rgba(0,0,0,0.08);
  border-radius:14px;

  padding:12px 18px;

  font-size:16px;
  font-weight:600;

  cursor:pointer;

  background:white;
  color:#424b54;

  box-shadow:0 4px 10px rgba(0,0,0,0.06);

  transition:.25s ease;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  margin-top:10px;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(0,0,0,0.08);
}

.btn:active{
  transform:scale(.97);
}

.btn-icon{
  width:20px;
  height:20px;
  object-fit:contain;
}

/* =========================
ANIMÁCIÓ
========================= */

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>
</head>

<body>

<div class="card">

  <div class="title">Napi pozitív</div>

  <div id="kategoria" class="tag"></div>

  <div id="uzenet" class="message"></div>

  <div id="szerzo" class="author"></div>

  <!-- BRAND GOMB -->
  <a href="index2.html" class="btn-link">
    <button class="btn">
      <img src="brand-icon.png" alt="Kattkaland" class="btn-icon">
      <span style="font-family:'Alex Brush', cursive; font-size:22px;">
        Kattkaland
      </span>
    </button>
  </a>

</div>

<script>

// =====================================================
// HASH
// =====================================================

function hashCode(str){
  let hash = 0;
  for(let i = 0; i < str.length; i++){
    hash = str.charCodeAt(i) + ((hash << 5) - hash);
  }
  return hash;
}

// =====================================================
// DEVICE ID
// =====================================================

function getDeviceId(){
  let id = localStorage.getItem("deviceId");
  if(!id){
    id = Math.random().toString(36).substring(2) + Date.now();
    localStorage.setItem("deviceId", id);
  }
  return id;
}

// =====================================================
// DÁTUM
// =====================================================

function getTodayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

// =====================================================
// GOOGLE SHEETS
// =====================================================

const SHEET_ID = "1-iH4MYuNDCfi7C2weM59gY1J15bsbwxeHHFmJ2GA9PQ";
const SHEET_NAME = "Munkalap1";

const JSON_URL =
  `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

// =====================================================
// ADATBETÖLTÉS
// =====================================================

async function loadQuotes(){
  try{
    const res = await fetch(JSON_URL);
    const data = await res.json();

    return data.map(item => ({
      category: item.Kategória || "Idézet",
      text: item.Üzenet || "",
      author: item.Szerző || ""
    })).filter(x => x.text.trim() !== "");
  }
  catch(e){
    return [{
      category:"Hiba",
      text:"Nem sikerült betölteni 😔",
      author:""
    }];
  }
}

// =====================================================
// VÁLASZTÁS
// =====================================================

function pickMessage(arr, seed){
  const h = Math.abs(hashCode(seed));
  return arr[h % arr.length];
}

// =====================================================
// MEGJELENÍTÉS
// =====================================================

async function megjelenit(){

  const messages = await loadQuotes();

  const seed = getTodayKey() + getDeviceId();

  const msg = pickMessage(messages, seed);

  document.getElementById("kategoria").innerText = msg.category;
  document.getElementById("uzenet").innerText = msg.text;

  const authorEl = document.getElementById("szerzo");

  if(msg.author && msg.author.trim() !== ""){
    authorEl.innerText = "— " + msg.author;
    authorEl.style.display = "block";
  } else {
    authorEl.style.display = "none";
  }
}

megjelenit();

</script>

</body>
</html>
